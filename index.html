   html:`<p>Mini whiteboards: write <b>T</b> (true), <b>F</b> (false) or <b>?</b> (not sure). Hold up on "3, 2, 1, show me". We won't reveal the answers yet.</p>${voteUI()}`,
   notes:"Diagnostic. Tally T/F/? for each statement (photograph boards or use a quick class count). Answers are revealed in Lesson 28, when students compare their thinking."},
  {mode:"check", h:"Exit: whip around",
   html:`<div class="grid2 fill"><div class="box" style="justify-content:center"><p class="lead">Everyone says <b>one sentence</b> out loud:</p><p class="def">"A force I used today was a ___. It made ___."</p><p class="small">No repeats.</p></div>${exitFist(["I can describe a force as a push or a pull.","I can give everyday examples of pushes, pulls, twists and stretches."])}</div>`,
   notes:"Note students on 0 to 2 fingers for a check-in at the start of Lesson 2."}
  ]},

{ n:2, title:"Contact and non-contact forces",
  li:"Identify and classify different types of forces.",
  sc:["I can explain the difference between contact and non-contact forces.","I can name and classify six common forces."],
  prep:"Demo kit: pen, balloon, book, magnet and paperclips, toy trolley or car, sheet of paper. Sign on each side of the room: CONTACT and NON-CONTACT.",
  slides:[
  {mode:"check", h:"Retrieval: last lesson in 3 questions",
   html:`<p>Mini whiteboards. Write, then hold up on "3, 2, 1, show me".</p><div class="grid3">${[
     ["1. What is a force?","A push or a pull on an object, caused by an interaction between two objects."],
     ["2. Name three things a force can do.","Start, stop, speed up, slow down, change direction, change shape."],
     ["3. Is twisting a lid a push or a pull?","A twist: a turning force made of pushes and pulls in a circle."]].map(c=>rv(c[0],c[1])).join("")}</div>`,
   notes:"Quick read of the room. Reteach the definition if many miss Q1."},
  {mode:"learn", h:"Two families of forces",
   html:`<div class="grid2 fill"><div class="fcard fric"><span class="tag">Family 1</span><h3 style="font-size:3cqw">Contact forces</h3><p class="lead">Objects must <b>touch</b> for the force to act.</p><p>Pushing a trolley. Friction on your shoes. Air pushing on a parachute.</p></div>
   <div class="fcard grav"><span class="tag">Family 2</span><h3 style="font-size:3cqw">Non-contact forces</h3><p class="lead">The force acts <b>at a distance</b>, across a gap.</p><p>Gravity pulling a falling apple. A magnet pulling a paperclip. A balloon pulling your hair.</p></div></div>`,
   notes:"Ask: can you think of a force that acts without touching? Students usually name gravity and magnets first."},
  {mode:"learn", h:"Six forces to know",
   html:fcards()+`<p class="small">Each force keeps the same colour all unit. You'll see these colours again on force diagrams.</p>`,
   notes:"Students copy into the summary table at the end of the lesson, not now. Point out: air resistance is a contact force (air particles touch the object)."},
  {mode:"whole", h:"Watch it, name it", init:"vote",
   data:[["I drop a pen.","Gravity (non-contact). Earth pulls the pen down without touching it."],["I rub a balloon on my hair and hold it near a student's hair.","Electrostatic force (non-contact). The hair is pulled across a gap."],["I slide a book across the desk and it stops.","Friction (contact) between the book and the desk."],["I hold a magnet above a paperclip.","Magnetic force (non-contact). The clip jumps up across a gap."],["I push the trolley.","Applied force (contact) from my hand."],["I drop a flat sheet of paper. It floats down slowly.","Gravity pulls it down. Air resistance (contact) pushes up against it."]],
   html:`<p>Watch each demo. On whiteboards write the <b>force</b> and <b>C</b> (contact) or <b>NC</b> (non-contact).</p>${voteUI("Reveal answer")}`,
   notes:"Do each demo live, then click to reveal. The paper drop has two forces, which sets up balanced forces next lesson."},
  {mode:"whole", h:"Sort it: contact or non-contact?", init:"sort",
   data:{zones:[["c","Contact","fric"],["nc","Non-contact","grav"]],
     items:[["Kicking a ball","c"],["A skydiver slowing down","c"],["Earth pulling the Moon","nc"],["Brakes stopping a car","c"],["A compass needle turning","nc"],["Hair standing up after a jumper is pulled off","nc"],["Rowing a boat","c"],["A sail filling with wind","c"],["An apple falling","nc"],["Sliding down a slide","c"],["A fridge magnet holding a note","nc"],["Lightning","nc"],["Pushing a lawn mower","c"],["Rubbing hands to warm them","c"]]},
   html:`<p class="small">Click a card, then a box. Press Check when the class agrees.</p>${sortUI}`,
   notes:"Ask students to name the specific force for each card as they place it."},
  {mode:"move", h:"Two sides of the room", init:"corners",
   data:{corners:[["c","Contact","fric"],["nc","Non-contact","grav"]],
     how:["One side of the room is CONTACT. The other is NON-CONTACT.","Read the item and walk to your side.","If there are two forces and you can name both, stand in the <b>middle</b>.","Be ready to name the force."],
     items:[["A koala gripping a branch",["c"],"Friction (and the branch pushing up)."],["A satellite orbiting Earth",["nc"],"Gravity."],["A cyclist feeling the wind",["c"],"Air resistance."],["A balloon stuck to the wall",["nc","c"],"Electrostatic force holds it. Friction stops it sliding."],["A falling leaf",["nc","c"],"Gravity pulls down. Air resistance pushes up."],["A tow truck pulling a car",["c"],"Applied force through the rope."],["Magnetic toy trains joining",["nc"],"Magnetic force."],["A surfer on a wave",["c","nc"],"Water pushes the board. Gravity pulls the surfer down the wave."]]},
   html:cornersUI,
   notes:"Students in the middle must name both forces. That's the high-level answer."},
  {mode:"talk", timer:3, h:"Tricky ones",
   html:`<p>Turn and talk. Decide and justify, then click to compare.</p><div class="grid3">${[
     ["Is air resistance contact or non-contact?","Contact. Billions of air particles hit the object. You can't see them, but they touch it."],
     ["A magnet picks up a paperclip through a table. Contact?","Non-contact. The force passes through the table without the magnet touching the clip."],
     ["Does gravity act on a plane flying at 10 km high?","Yes. Gravity is non-contact and reaches far into space. The wings' lift balances it."]].map(c=>rv(c[0],c[1])).join("")}</div>`,
   notes:"Common misconception: air resistance is non-contact because air is invisible."},
  {mode:"write", timer:7, h:"Summary table", init:"cells",
   html:`<div class="tablewrap"><table class="ctable"><thead><tr><th>Force</th><th>Contact or non-contact?</th><th>What it does</th><th>Example</th></tr></thead><tbody>${FORCE_SIX.map(f=>`<tr><td><span class="fbadge ${f[0]}">${f[1]}</span></td><td class="rcell">${f[2]}</td><td class="rcell">${f[3]}</td><td class="rcell">${f[4]}</td></tr>`).join("")}</tbody></table></div><div class="row"><button class="btn" id="cellsAll">Reveal all</button><span class="small">Copy the table. Fill it in first, then click to check.</span></div>`,
   notes:"Classification task evidence. Students who finish early add a second example of their own for each force."},
  {mode:"check", h:"Exit ticket",
   html:`<div class="grid3">${[
     ["Name one contact force and one non-contact force.","Contact: applied, friction, air resistance. Non-contact: gravity, magnetic, electrostatic."],
     ["What is the difference between them?","Contact forces need objects to touch. Non-contact forces act across a gap."],
     ["A ball falls through the air. Name both forces.","Gravity (non-contact, down) and air resistance (contact, up)."]].map(c=>rv(c[0],c[1])).join("")}</div>${exitFist(["I can explain the difference between contact and non-contact forces.","I can name and classify six common forces."])}`,
   notes:"Collect written answers on sticky notes at the door if you want a record."}
  ]},

{ n:3, title:"Balanced and unbalanced forces",
  li:"Understand how balanced and unbalanced forces affect motion.",
  sc:["I can explain what balanced and unbalanced forces are.","I can predict whether an object will stay still, keep moving steadily, speed up or slow down."],
  prep:"Rope for tug of war (or a long scarf). Books, toy cars, a ramp. Scenario worksheet.",
  slides:[
  {mode:"check", h:"Retrieval: contact or non-contact?",
   html:`<div class="grid4">${[["Friction","Contact"],["Gravity","Non-contact"],["Air resistance","Contact"],["Magnetic force","Non-contact"]].map(c=>rv(c[0],c[1],"Whiteboards, then click")).join("")}</div><p class="small">Bonus: name a non-contact force that can attract <b>or</b> repel. (Magnetic or electrostatic.)</p>`,
   notes:"Fast warm-up. Two minutes maximum."},
  {mode:"move", timer:4, h:"Tug of war",
   html:`<div class="grid2 fill"><div class="box">${steps(["Two volunteers hold each end of the rope.","Round 1: both pull <b>equally hard</b>. Watch the middle of the rope.","Round 2: one person pulls harder.","Round 3: one person lets go a little."])}</div>
   <div class="box"><h3>Predict first</h3><p>In each round, what happens to the middle of the rope?</p><p class="small">Safety: pull steadily, no sudden letting go. Mats or soft ground.</p></div></div>`,
   notes:"Mark the middle with tape. Round 1 the tape stays still even though both people are pulling hard. That is the key observation."},
  {mode:"learn", h:"Balanced and unbalanced",
   html:`<div class="grid2"><div class="fcard push"><h3 style="font-size:2.8cqw">Balanced forces</h3><p>Forces are the <b>same size</b> and act in <b>opposite directions</b>. They cancel out.</p><p class="lead">Motion <b>does not change</b>.</p></div>
   <div class="fcard fric"><h3 style="font-size:2.8cqw">Unbalanced forces</h3><p>One force is <b>bigger</b> than the other. They do not cancel.</p><p class="lead">Motion <b>changes</b>: speeds up, slows down or changes direction.</p></div></div>
   <p class="def">The <b>net force</b> is what is left after forces cancel. Balanced means net force = 0 N.</p>`,
   notes:"Students copy both definitions. We'll measure force in newtons (N) next lesson."},
  {mode:"whole", h:"Tug of war simulator", init:"tug", data:{l:40,r:40},
   html:tugUI,
   notes:"Start balanced and press Let go: nothing happens. Then change one slider and let go. Ask a student to predict before each go. Try 60 and 60: big forces can still be balanced."},
  {mode:"watch", h:"How forces affect motion",
   html:vid("j-GkorESUkU","How Forces Affect Motion: Balanced and Unbalanced Forces","Miacademy",["What is a net force?","Give one example of balanced forces from the video.","What happens to an object when forces are unbalanced?"]),
   notes:"Pause at the net force section and check with thumbs up or down."},
  {mode:"learn", h:"Balanced does not always mean still",
   html:`<div class="grid4">${[["Still, stays still","A book on a desk. Gravity down, desk pushes up. Balanced.","push"],["Moving, keeps moving at the same speed","A car on cruise control. Engine force = friction + air resistance. Balanced.","air"],["Speeds up","A sprinter pushing off the blocks. Unbalanced forward.","fric"],["Slows down","A bike braking. Friction is bigger than the push forward. Unbalanced backwards.","grav"]].map(c=>`<div class="fcard ${c[2]}"><h3>${c[0]}</h3><p>${c[1]}</p></div>`).join("")}</div>
   <p class="lead">Balanced forces keep the motion the <b>same</b>. That can mean still <i>or</i> steady speed.</p>`,
   notes:"Big misconception: students think a moving object must have an unbalanced force on it. The cruise control car is the key example."},
  {mode:"prac", timer:8, h:"Demo stations",
   html:`<div class="grid3">${[["Book on a desk","Push the book gently from both sides with equal force. Then push harder from one side."],["Toy car","Roll the car along the floor. What makes it slow down? Then push it at a steady speed."],["Two-person push","Two students push a box from opposite sides. Make it stay still, then make it move."]].map(c=>`<div class="box"><h3>${c[0]}</h3><p>${c[1]}</p><p class="small">Record: balanced or unbalanced? What happened to the motion?</p></div>`).join("")}</div>`,
   notes:"Can be run as teacher demos at the front if time is short."},
  {mode:"whole", h:"Balanced or unbalanced?", init:"vote",
   data:[["A lamp hanging still from the ceiling.","Balanced. Gravity down equals the cord pulling up."],["A soccer ball just after it is kicked.","Unbalanced. The kick is much bigger than friction, so it speeds up."],["A plane flying level at a steady speed.","Balanced. Thrust = drag, lift = weight."],["A skateboarder rolling to a stop.","Unbalanced. Friction slows them down."],["A rocket lifting off.","Unbalanced. Thrust up is bigger than gravity down."],["You sitting still on your chair.","Balanced. Gravity down, chair pushes up."]],
   html:`<p>Thumbs up = balanced. Thumbs down = unbalanced. Then justify.</p>${voteUI()}`,
   notes:"Ask a thumbs-up and a thumbs-down student to argue before revealing."},
  {mode:"write", timer:8, h:"Scenario questions",
   html:`<p>Answer in your book. Use the words <b>balanced</b>, <b>unbalanced</b> and <b>motion</b>.</p><div class="grid2">${[
     ["1. A shopping trolley is pushed at a steady speed. Are the forces balanced?","Yes, balanced. The push forward equals friction backwards, so the speed stays the same."],
     ["2. You stop pushing the trolley. What happens and why?","It slows down and stops. Friction is now unbalanced, acting backwards."],
     ["3. A tug of war rope is not moving. Does this mean nobody is pulling?","No. Both teams pull equally hard in opposite directions. The forces are balanced."],
     ["4. Challenge: a parachutist falls at a steady speed. Explain using forces.","Air resistance up equals gravity down. Balanced forces, so the speed doesn't change."]].map(c=>rv(c[0],c[1],"Click to check")).join("")}</div>`,
   notes:"Worksheet evidence. Reveal one at a time after students have attempted them."},
  {mode:"check", h:"Exit: one sentence",
   html:`<div class="grid2 fill"><div class="box" style="justify-content:center"><p class="lead">Finish the sentence on a sticky note:</p><p class="def">"When forces are unbalanced, the object will ___ because ___."</p></div>${exitFist(["I can explain what balanced and unbalanced forces are.","I can predict whether an object will stay still, keep moving steadily, speed up or slow down."])}</div>`,
   notes:"Sort sticky notes into 'got it' and 'not yet' for Lesson 4 groups."}
  ]},

{ n:4, title:"Measuring force",
  li:"Recognise that force can be measured in newtons.",
  sc:["I can read a spring balance (force meter) correctly.","I can record force measurements in a table and explain why we repeat trials."],
  prep:"Spring balances (force meters) 0 to 10 N, one per pair. Masses or bags of known mass. Shoe, pencil case, string. Recording sheet.",
  slides:[
  {mode:"check", h:"Retrieval: balanced or unbalanced?",
   html:`<div class="grid3">${[["A car parked on a hill","Balanced. It stays still."],["A ball rolling slower and slower","Unbalanced. Friction slows it."],["A lift moving up at a steady speed","Balanced. Steady speed, no change in motion."]].map(c=>rv(c[0],c[1])).join("")}</div>`,
   notes:"The lift is the tricky one. Moving, but balanced."},
  {mode:"learn", h:"Force is measured in newtons",
   html:`<div class="grid2 fill"><div style="display:flex;flex-direction:column;gap:1.2cqw"><p class="def">The unit of force is the <b>newton</b>, written <b>N</b>.</p>
   <div class="box"><h3>How big is 1 newton?</h3><p>About the force needed to hold up a <b>small apple</b> (100 g).</p></div>
   <div class="box"><h3>Named after Isaac Newton</h3><p>An English scientist (1643 to 1727) who explained how forces change motion and how gravity works.</p></div></div>
   <div class="grid2">${[["Holding a phone","2 N"],["Opening a door","5 to 10 N"],["Lifting a 1 L bottle of water","10 N"],["A kick to a soccer ball","about 1000 N"]].map(c=>rv(c[0],c[1],"Guess, then click")).join("")}</div></div>`,
   notes:"Hand round an apple or a 100 g mass so students can feel 1 N. Estimation builds number sense for later lessons."},
  {mode:"learn", h:"How to use a spring balance",
   html:`<div class="grid2 fill"><div class="box">${steps(["Check it reads <b>0</b> with nothing on it. Adjust if needed (zero it).","Hold it <b>vertically</b> for hanging objects, or <b>level</b> for pulling along a desk.","Pull or hang <b>steadily</b>. Don't jerk it.","Read the scale at <b>eye level</b> where the pointer is.","Write the number <b>and the unit</b> (N)."])}</div>
   <div class="box"><h3>Why does it work?</h3><p>The bigger the force, the more the spring <b>stretches</b>. The scale turns the stretch into newtons.</p><p class="small">Don't pull past the top of the scale. You can overstretch the spring and wreck it.</p></div></div>`,
   notes:"Model each step with a real force meter under the visualiser if you have one."},
  {mode:"whole", h:"Read the scale", init:"scale", data:{planets:false},
   html:scaleUI,
   notes:"Cover the reading, add masses and ask students to predict the reading in N. Pattern: every 100 g adds about 1 N. Uncover to check."},
  {mode:"prac", timer:15, h:"Practical: measure pushes and pulls",
   html:`<div class="grid2 fill"><div class="box">${steps(["Pairs. One measures, one records.","Zero your force meter.","Measure each task <b>3 times</b>.","Record every trial in your table."])}<h3>Tasks</h3><ul><li>Lift your pencil case</li><li>Drag a shoe slowly across the desk</li><li>Open a door (hook on the handle)</li><li>Lift a 500 g mass</li></ul></div>
   <div class="tablewrap"><table class="ctable"><thead><tr><th>Task</th><th>Trial 1 (N)</th><th>Trial 2 (N)</th><th>Trial 3 (N)</th><th>Average (N)</th></tr></thead><tbody>${["Pencil case","Shoe","Door","500 g mass"].map(t=>`<tr><td>${t}</td><td></td><td></td><td></td><td></td></tr>`).join("")}</tbody></table></div></div>`,
   notes:"Practical recording sheet is the assessment. Check every pair has zeroed their meter and is writing units."},
  {mode:"learn", h:"Why repeat trials?", init:"cells",
   html:`<div class="grid2"><div class="tablewrap"><table class="ctable"><thead><tr><th>Task</th><th>T1</th><th>T2</th><th>T3</th><th>Average</th></tr></thead><tbody><tr><td>Dragging a shoe</td><td>3.2</td><td>3.6</td><td>3.4</td><td class="rcell">3.4 N</td></tr><tr><td>Opening a door</td><td>6.0</td><td>6.4</td><td>9.8</td><td class="rcell">6.2 N (ignore 9.8)</td></tr></tbody></table></div>
   <div class="box"><h3>Average = add them up, divide by how many</h3><p>(3.2 + 3.6 + 3.4) &divide; 3 = <b>3.4 N</b></p><p>A result that doesn't fit the pattern (like 9.8) is an <b>anomaly</b>. Check it, and leave it out of the average if it was a mistake.</p></div></div>
   <p class="lead">Repeating trials makes results more <b>reliable</b>. One reading could be a fluke.</p>`,
   notes:"Click the average cells after students calculate them. 'Reliable' and 'anomaly' go in the glossary."},
  {mode:"talk", timer:3, h:"Why were our readings different?",
   html:`<div class="grid3">${[["Reason 1","Pulling with a jerk instead of steadily."],["Reason 2","Not reading the scale at eye level (parallax)."],["Reason 3","The meter was not zeroed, or was held at an angle."]].map(c=>rv(c[0],c[1],"Discuss, then click")).join("")}</div>`,
   notes:"These are errors students will name in their evaluations in Weeks 3 and 6. Worth spending time here."},
  {mode:"check", h:"Exit ticket",
   html:`<div class="grid3">${[["What unit is force measured in?","Newtons (N)."],["Give two tips for reading a force meter accurately.","Zero it first, pull steadily, read at eye level."],["Why do we repeat trials?","To make results more reliable and spot anomalies."]].map(c=>rv(c[0],c[1])).join("")}</div>${exitFist(["I can read a spring balance (force meter) correctly.","I can record force measurements in a table and explain why we repeat trials."])}`,
   notes:"Collect recording sheets."}
  ]}
);
/* ---------- Week 2: Gravity, friction and air resistance ---------- */
LESSONS.push(
{ n:5, title:"Gravity",
  li:"Understand gravity as a non-contact force.",
  sc:["I can explain why objects fall towards Earth.","I can correct common misconceptions about gravity."],
  prep:"A book, a sheet of paper, a tennis ball and a golf ball (or two balls of different mass). Mini whiteboards.",
  slides:[
  {mode:"check", h:"Retrieval: Lesson 4",
   html:`<div class="grid3">${[["What unit do we measure force in?","Newtons (N)."],["What does a spring balance use to measure force?","How far a spring stretches."],["Why do we repeat trials?","To make results reliable and spot anomalies."]].map(c=>rv(c[0],c[1])).join("")}</div>`,
   notes:"Two minutes. Cold call."},
  {mode:"talk", timer:3, h:"Why do things fall down, not up?",
   html:`<div class="grid2 fill"><div style="display:grid;place-items:center">${earthPullSVG()}</div><div class="box"><h3>Think, pair, share</h3>${steps(["Why does a dropped pen fall to the floor?","People in Australia and people in England both drop pens. Do the pens fall the same way?","What is 'down', really?"])}<p class="small">Look at the picture before you answer the last question.</p></div></div>`,
   notes:"Key idea: 'down' means towards the centre of Earth. Australians are not upside down; gravity pulls everyone towards Earth's centre."},
  {mode:"learn", h:"What is gravity?",
   html:`<p class="def"><b>Gravity</b> is a <b>non-contact</b> force of attraction between any two objects that have <b>mass</b>.</p>
   <div class="grid3"><div class="fcard grav"><h3>Everything pulls</h3><p>You pull on Earth and Earth pulls on you. Earth is so massive that its pull is the one we notice.</p></div><div class="fcard grav"><h3>Bigger mass, bigger pull</h3><p>Jupiter pulls harder than Earth. The Moon pulls about 1/6 as hard.</p></div><div class="fcard grav"><h3>Closer, stronger</h3><p>Gravity gets weaker with distance, but it never switches off. It holds the Moon in orbit.</p></div></div>`,
   notes:"Copy the definition. Link to Lesson 2: gravity acts across a gap."},
  {mode:"watch", h:"How gravity affects weight and motion",
   html:vid("8M3Fzdb1b9g","Forces: Gravity, How Gravity Affects Weight and Motion","Miacademy",["What two things decide how strong gravity is between two objects?","Why do we stay on the ground?","Does the video say anything about weight? Note it for next lesson."]),
   notes:"Students jot answers in their books. Weight is the bridge into Lesson 6."},
  {mode:"whole", h:"Predict: which hits the floor first?", init:"vote",
   data:[["A book and a flat sheet of paper, dropped together.","The book lands first. Air resistance slows the flat paper a lot."],["A book and a crumpled ball of paper.","They land at almost the same time! Crumpling the paper cuts air resistance."],["The paper placed flat ON TOP of the book.","They fall together. The book shields the paper from the air."],["A tennis ball and a golf ball (heavier).","Almost exactly together. Gravity makes them speed up at the same rate."]],
   html:`<p>On whiteboards write <b>A</b>, <b>B</b> or <b>same time</b>. Then watch the demo.</p>${voteUI("Reveal what happened")}`,
   notes:"Do each drop live from the same height after predictions. The paper-on-book drop surprises most students."},
  {mode:"watch", h:"A feather and a bowling ball",
   html:vid("E43-CfukEgs","Brian Cox visits the world's biggest vacuum","BBC Human Universe",["Predict: in a room with no air, which lands first?","Why do the feathers usually fall slowly?","What does this tell us about gravity?"]),
   notes:"Pause before the drop to take predictions. Key idea: without air, all objects fall at the same rate. Air resistance, not mass, makes the difference."},
  {mode:"whole", h:"Misconception check", init:"vote",
   data:[["Heavy objects always fall faster than light ones.","False. Without air, everything falls at the same rate. Air resistance slows light, spread-out objects."],["There is no gravity in space.","False. Gravity keeps the Moon in orbit. Astronauts float because they are falling around Earth with their spacecraft."],["Gravity needs air to work.","False. Gravity works in a vacuum, as the video showed."],["Gravity only pulls things down.","Partly true! It pulls towards the centre of the other object. For Earth that is what we call down."],["The Moon has no gravity.","False. The Moon's gravity is about 1/6 of Earth's. It causes ocean tides."]],
   html:`<p>Thumbs up = true. Thumbs down = false. Then justify.</p>${voteUI()}`,
   notes:"Students correct any of the Lesson 1 concept check answers they now think were wrong."},
  {mode:"write", timer:7, h:"Short written explanation",
   html:`<div class="grid2 fill"><div class="box"><h3>Explain in 4 to 6 sentences</h3><p class="lead">A student says: "The bowling ball fell faster than the feather because it is heavier." Is the student right? Explain using the word <b>gravity</b> and <b>air resistance</b>.</p></div>
   <div class="box"><h3>Sentence starters</h3><ul><li class="starter">The student is partly right because...</li><li class="starter">Gravity pulls on both objects...</li><li class="starter">The feather falls slowly in air because...</li><li class="starter">In the vacuum chamber...</li><li class="starter">So the real reason is...</li></ul></div></div>`,
   notes:"Assessment: written response. Look for: gravity acts on both; air resistance slows the feather; in a vacuum they land together."},
  {mode:"check", h:"Exit ticket",
   html:`<div class="grid3">${[["Is gravity a contact or non-contact force?","Non-contact."],["Why does a feather fall slowly on Earth?","Air resistance pushes up on it and nearly balances gravity."],["Which direction does gravity pull?","Towards the centre of Earth (or any massive object)."]].map(c=>rv(c[0],c[1])).join("")}</div>${exitFist(["I can explain why objects fall towards Earth.","I can correct common misconceptions about gravity."])}`,
   notes:""}
  ]},

{ n:6, title:"Mass and weight",
  li:"Distinguish between mass and weight.",
  sc:["I can explain the difference between mass and weight.","I can calculate weight using weight = mass x gravity."],
  prep:"Kitchen scales and a spring balance. A 1 kg bag of flour or rice. Calculators.",
  slides:[
  {mode:"check", h:"Retrieval: gravity",
   html:`<div class="grid3">${[["What is gravity?","A non-contact force of attraction between objects with mass."],["Why did the feather and bowling ball land together in the video?","No air, so no air resistance. Gravity speeds everything up at the same rate."],["Which pulls harder: Earth or the Moon?","Earth. It has more mass."]].map(c=>rv(c[0],c[1])).join("")}</div>`,
   notes:""},
  {mode:"talk", timer:2, h:"Would you weigh less on the Moon?",
   html:`<div class="box fill" style="justify-content:center;align-items:center;text-align:center"><p class="spot" style="font-size:4.5cqw">An astronaut has a mass of 80 kg on Earth.</p><p class="lead">On the Moon, is she still 80 kg? Does she weigh the same?</p></div>`,
   notes:"Take a quick vote. Leave the disagreement hanging until the next slide."},
  {mode:"learn", h:"Mass and weight are not the same",
   html:`<div class="compare"><div class="fcard push"><h3 style="font-size:2.8cqw">Mass</h3><p class="lead">The amount of <b>matter</b> in an object.</p><ul><li>Measured in <b>kilograms (kg)</b></li><li>Measured with a balance or scales</li><li>The <b>same</b> everywhere in the universe</li></ul></div><span class="vs">vs</span>
   <div class="fcard grav"><h3 style="font-size:2.8cqw">Weight</h3><p class="lead">The <b>force of gravity</b> on an object.</p><ul><li>Measured in <b>newtons (N)</b></li><li>Measured with a spring balance</li><li><b>Changes</b> depending on gravity</li></ul></div></div>
   <p class="small">In everyday life we say "I weigh 50 kilograms". A scientist would say "my mass is 50 kg".</p>`,
   notes:"Students copy into a two-column table. Back to the astronaut: same mass (80 kg) but less weight on the Moon."},
  {mode:"watch", h:"Mass vs weight",
   html:vid("QMGWA-acyLg","Mass vs. Weight: What's the Difference?","LaFountaine of Knowledge",["What unit is mass measured in? Weight?","What happens to your mass on the Moon? Your weight?","Where in the universe would you have mass but almost no weight?"]),
   notes:"Answer to Q3: deep space, far from any planet or star."},
  {mode:"learn", h:"Calculating weight",
   html:`<div class="grid2 fill"><div style="display:flex;flex-direction:column;gap:1.2cqw"><p class="def"><b>weight</b> (N) = <b>mass</b> (kg) &times; <b>gravity</b> (N/kg)</p>
   <div class="box"><h3>On Earth, gravity = 9.8 N/kg</h3><p>Every kilogram is pulled down with 9.8 N. We often round to <b>10 N/kg</b> to make it easier.</p></div></div>
   <div class="box"><h3>Worked example</h3>${steps(["A school bag has a mass of 4 kg.","weight = 4 kg &times; 9.8 N/kg","weight = <b>39.2 N</b>"])}<p class="small">Always write the unit: kg for mass, N for weight.</p></div></div>`,
   notes:"Model one more on the board: a 60 kg student weighs 588 N."},
  {mode:"whole", h:"Weigh it on other worlds", init:"scale", data:{planets:true},
   html:scaleUI,
   notes:"Hang 500 g. Switch planets: mass stays 0.5 kg, weight changes. Jupiter goes off a 10 N scale, so the scale here goes to 30 N."},
  {mode:"group", timer:8, h:"Application questions",
   html:`<p>Pairs. Use g = 9.8 N/kg on Earth, 1.6 N/kg on the Moon. Show working.</p><div class="grid2">${[
     ["1. A cat has a mass of 5 kg. What is its weight on Earth?","5 &times; 9.8 = 49 N"],
     ["2. A 70 kg astronaut goes to the Moon. What is her mass there?","Still 70 kg. Mass doesn't change."],
     ["3. What is the astronaut's weight on the Moon?","70 &times; 1.6 = 112 N (on Earth it is 686 N)."],
     ["4. A rock weighs 98 N on Earth. What is its mass?","98 &divide; 9.8 = 10 kg"]].map(c=>rv(c[0],c[1],"Click to check")).join("")}</div>`,
   notes:"Q4 reverses the formula. Extension: why do astronauts on the Moon bounce when they walk?"},
  {mode:"check", h:"Quick review quiz", init:"quiz",
   data:[["Mass is measured in...",["Newtons","Kilograms","Metres","Seconds"],1,"Mass is in kilograms (kg)."],["Weight is...",["The amount of matter","The force of gravity on an object","The size of an object","How dense it is"],1,"Weight is a force, so it is in newtons."],["On the Moon, your mass is...",["Smaller","Bigger","The same","Zero"],2,"Mass never changes with location."],["A 2 kg bag of sugar on Earth weighs about...",["2 N","20 N","0.2 N","200 N"],1,"2 &times; 9.8 = 19.6 N, about 20 N."],["Which instrument measures weight?",["Ruler","Kitchen scales","Spring balance","Thermometer"],2,"A spring balance measures force in newtons."]],
   html:quizUI,
   notes:"Teams of 4 with a whiteboard each. Class task evidence."},
  {mode:"check", h:"Exit: fix the sentence",
   html:`<div class="grid2 fill"><div class="box" style="justify-content:center"><p class="lead">Rewrite this sentence so it is scientifically correct:</p><p class="def">"My weight is 45 kilograms, and on the Moon it would be the same."</p>${rv("Model answer","My mass is 45 kg. My weight on Earth is about 441 N, and on the Moon my weight would be much less (about 72 N), but my mass would still be 45 kg.")}</div>${exitFist(["I can explain the difference between mass and weight.","I can calculate weight using weight = mass x gravity."])}</div>`,
   notes:""}
  ]},

{ n:7, title:"Friction",
  li:"Understand friction as a force that opposes movement.",
  sc:["I can explain what friction is and what affects it.","I can give examples of useful and unwanted friction.","I can predict which surfaces will slow a toy car the most."],
  prep:"A book, a ramp or board, and surface samples: carpet, towel, sandpaper, cardboard, tiles. A toy car.",
  slides:[
  {mode:"check", h:"Retrieval: mass and weight",
   html:`<div class="grid3">${[["Mass is measured in ___. Weight in ___.","Kilograms (kg). Newtons (N)."],["What is the weight of a 10 kg dog on Earth?","10 &times; 9.8 = 98 N"],["Does mass change on Mars?","No. Only weight changes."]].map(c=>rv(c[0],c[1])).join("")}</div>`,
   notes:""},
  {mode:"prac", timer:4, h:"Demo: slide a book",
   html:`<div class="grid2 fill"><div class="box">${steps(["Slide a book across the desk with a quick push. Why does it stop?","Now slide it across carpet. Then across tiles or a smooth floor.","Rub your hands together hard for 10 seconds. What do you feel?"])}</div><div class="box"><h3>Record</h3><p>Which surface made the book stop <b>fastest</b>? Which let it slide <b>furthest</b>?</p><p class="small">Your hands get warm because friction turns movement energy into heat.</p></div></div>`,
   notes:"Students do the hand rub themselves. Ask: what force was acting on the book after it left your hand?"},
  {mode:"learn", h:"What is friction?",
   html:`<p class="def"><b>Friction</b> is a <b>contact</b> force that <b>opposes</b> motion when two surfaces slide or try to slide past each other.</p>
   <div class="grid3"><div class="fcard fric"><h3>Acts against motion</h3><p>It always points the opposite way to the movement.</p></div><div class="fcard fric"><h3>Rougher = more friction</h3><p>Tiny bumps on the surfaces catch on each other. Even smooth surfaces have microscopic bumps.</p></div><div class="fcard fric"><h3>Makes heat</h3><p>Friction turns movement energy into heat. That's why brakes get hot.</p></div></div>
   <p class="small">Friction also gets bigger when surfaces are pressed together harder.</p>`,
   notes:"Draw a zoomed-in sketch of two rough surfaces catching on each other."},
  {mode:"watch", h:"How surfaces affect motion",
   html:vid("KPbMpGyV7Ps","Forces: Friction, How Surfaces Affect Motion","Miacademy",["Which kind of surface gives more friction?","Name one way to reduce friction.","Why is friction useful when you walk?"]),
   notes:""},
  {mode:"whole", h:"Useful or unwanted friction?", init:"sort",
   data:{zones:[["u","Useful friction","push"],["w","Unwanted friction","fric"]],
     items:[["Shoes gripping the ground","u"],["Brakes on a bike","u"],["Holding a pencil","u"],["Tyres on a wet road","u"],["Striking a match","u"],["Engine parts wearing out","w"],["A sticky drawer","w"],["Carpet burn","w"],["A bike chain that needs oil","w"],["Sliding on ice (if you need to stop!)","u w"],["A skier going down a slope","w"],["Rock climbing","u"]],
     note:"The ice card can go either way. Argue your case!"},
   html:`<p class="small">Click a card, then a box. Press Check when the class agrees.</p>${sortUI}`,
   notes:"Push for reasons: who would want friction here and who wouldn't?"},
  {mode:"talk", timer:4, h:"More friction or less?",
   html:`<div class="grid2">${[["Ways to increase friction","Rough surfaces, grip pads, tyre treads, sand on icy paths, chalk on a gymnast's hands, pushing surfaces together harder."],["Ways to decrease friction","Oil and grease, wheels and ball bearings, smooth or polished surfaces, wax on skis, ice."]].map(c=>rv(c[0],c[1],"Brainstorm in pairs, then click")).join("")}</div>`,
   notes:"Pairs list as many as they can in 2 minutes before revealing."},
  {mode:"group", timer:5, h:"Prediction task: which surface slows a car most?",
   html:`<div class="grid2 fill"><div class="box"><h3>Next week's practical</h3><p>A toy car rolls down a ramp onto different surfaces. We measure <b>how far</b> it travels.</p><div class="row">${["Smooth tiles","Cardboard","Carpet","Towel","Sandpaper"].map(t=>`<span class="chip" style="--sc:var(--fric)">${t}</span>`).join("")}</div></div>
   <div class="box"><h3>In your book</h3>${steps(["Rank the surfaces from <b>furthest</b> to <b>shortest</b> distance.","Explain your ranking in one sentence using the word <b>friction</b>.","Write how confident you are: 1 (guess) to 5 (certain)."])}</div></div>`,
   notes:"Prediction task is today's assessment. Keep it: students compare their prediction with real data in Week 3."},
  {mode:"learn", h:"Coming up: the friction investigation",
   html:`<div class="grid3">${[["Plan","Lesson 9: question, hypothesis and variables"],["Test","Lesson 10: real cars and ramps, 3 trials each"],["Compare and write","Lessons 11 and 12: online simulator, graph and a full report"]].map((c,i)=>`<div class="box"><span class="small" style="font-family:var(--f-mono);color:var(--accent);font-weight:700">STEP ${i+1}</span><h3>${c[0]}</h3><p>${c[1]}</p></div>`).join("")}</div><p class="lead">Practical Report 1 is worth 25% of this unit.</p>`,
   notes:"Use the weighting only if your faculty uses it. Adjust the slide text if not."},
  {mode:"check", h:"Exit ticket",
   html:`<div class="grid3">${[["Which direction does friction act?","Opposite to the direction of motion."],["Give one useful and one unwanted example of friction.","Useful: brakes, grip. Unwanted: wear on engine parts, sticky drawers."],["Why do brakes get hot?","Friction turns movement energy into heat."]].map(c=>rv(c[0],c[1])).join("")}</div>${exitFist(["I can explain what friction is and what affects it.","I can give examples of useful and unwanted friction.","I can predict which surfaces will slow a toy car the most."])}`,
   notes:""}
  ]},

{ n:8, title:"Air resistance",
  li:"Understand air resistance as a force that opposes motion through air.",
  sc:["I can explain what air resistance is and what affects it.","I can explain why parachutes work."],
  prep:"Sheets of A4 paper, coffee filters or cupcake cases, a plastic bag parachute, a stopwatch.",
  slides:[
  {mode:"check", h:"Retrieval: friction",
   html:`<div class="grid3">${[["Is friction a contact or non-contact force?","Contact."],["Name two things that increase friction.","Rough surfaces, pressing harder, treads, grip pads."],["Which surface do you predict will stop the car fastest?","Your answer from last lesson. We'll test it in Week 3!"]].map(c=>rv(c[0],c[1])).join("")}</div>`,
   notes:""},
  {mode:"prac", timer:5, h:"Paper drop challenge",
   html:`<div class="grid2 fill"><div class="box">${steps(["Hold two identical sheets of paper at the same height.","Crumple one into a tight ball.","Drop them at the same time. Which lands first?","Now find a way to make a sheet fall as <b>slowly</b> as possible."])}</div><div class="box"><h3>Think</h3><p>The two sheets have the <b>same mass</b>. So why does one fall faster?</p><p class="small">Try cupcake cases too: drop 1, then 3 stacked together.</p></div></div>`,
   notes:"Students in pairs. Collect the slowest designs to show the class. Key point: same mass, different shape, different air resistance."},
  {mode:"learn", h:"What is air resistance?",
   html:`<p class="def"><b>Air resistance</b> (also called <b>drag</b>) is a <b>contact</b> force that <b>opposes</b> motion through air. Air particles push against the moving object.</p>
   <div class="grid3"><div class="fcard air"><h3>Bigger surface area</h3><p>More air particles hit it, so more air resistance. Flat paper vs crumpled ball.</p></div><div class="fcard air"><h3>Faster speed</h3><p>The faster you move, the bigger the air resistance. Feel it on a bike.</p></div><div class="fcard air"><h3>Shape</h3><p>Streamlined shapes let air flow around them, so less air resistance.</p></div></div>`,
   notes:"Water resistance works the same way. Link to swimming and boat hulls."},
  {mode:"watch", h:"Air resistance",
   html:vid("JX--hZwF-Zs","KS3 Science: Air Resistance","Archie Science Show",["What two things make air resistance bigger?","What happens to air resistance as a skydiver speeds up?","What does a parachute change?"]),
   notes:"Pause at the skydiver section and ask students to predict before it is explained."},
  {mode:"learn", h:"Why do parachutes work?",
   html:`<div class="grid4">${[["1. Jump","Gravity is much bigger than air resistance. Unbalanced: the skydiver speeds up."],["2. Falling fast","Air resistance grows as speed grows."],["3. Steady speed","Air resistance = gravity. Balanced: steady speed (terminal velocity)."],["4. Parachute opens","Huge surface area. Air resistance becomes bigger than gravity, so they slow down to a safe, steady speed."]].map((c,i)=>`<div class="fcard ${["grav","fric","push","air"][i]}"><h3>${c[0]}</h3><p>${c[1]}</p></div>`).join("")}</div>
   <p class="lead">A parachute doesn't stop gravity. It makes air resistance big enough to <b>balance</b> gravity at a slow speed.</p>`,
   notes:"'Terminal velocity' is an extension word. Not required for Year 7 but good for curious students."},
  {mode:"whole", h:"Try the parachute simulator", init:"chute",
   html:chuteUI,
   notes:"Quick preview of Week 6. Try 0 cm (no canopy), then 30 cm, then 60 cm. Ask: why does a bigger canopy fall slower? Don't explore every variable yet; that's Lesson 20."},
  {mode:"whole", h:"Sort it: more or less air resistance?", init:"sort",
   data:{zones:[["more","Designed for MORE air resistance","air"],["less","Designed for LESS air resistance","fric"]],
     items:[["A parachute","more"],["A racing cyclist's helmet","less"],["A sycamore seed","more"],["A bullet train's nose","less"],["A sail on a yacht","more"],["A falcon diving","less"],["A dandelion seed","more"],["A swimmer's cap","less"],["Air brakes on a plane","more"],["A rocket","less"]]},
   html:`<p class="small">Click a card, then a box. Press Check when the class agrees.</p>${sortUI}`,
   notes:"Ask what shape features they all share: streamlined (pointed, smooth) vs large and flat."},
  {mode:"check", h:"Exit ticket",
   html:`<div class="grid2 fill"><div class="box"><h3>Answer on a sticky note</h3><p class="lead">Two pieces of paper have the same mass. One is flat and one is crumpled. Explain why the flat one falls more slowly.</p>${rv("Model answer","Both have the same gravity pulling down. The flat sheet has a bigger surface area, so more air particles push against it. Its air resistance is bigger, so it falls more slowly.")}</div>${exitFist(["I can explain what air resistance is and what affects it.","I can explain why parachutes work."])}</div>`,
   notes:"Exit ticket assessment. Sort into got it / not yet."}
  ]}
);
/* ---------- Week 3: Practical 1, friction investigation ---------- */
const PHET="https://phet.colorado.edu/sims/html/forces-and-motion-basics/latest/forces-and-motion-basics_en.html";
const REPORT_PARTS=[["Aim","What are you trying to find out?","To investigate how the type of surface affects the distance a toy car travels after rolling down a ramp."],
  ["Hypothesis","What do you think will happen and why? Use: If... then... because...","If the surface is rougher, then the car will travel a shorter distance, because rough surfaces create more friction, which slows the car down."],
  ["Variables","Independent (what you change), dependent (what you measure), controlled (what you keep the same).","IV: type of surface. DV: distance travelled (cm). CV: same car, same ramp height, same release point, no pushing, same measuring method."],
  ["Method","Numbered steps someone else could follow exactly. Include safety.","1. Set the ramp to 20 cm high. 2. Place the surface at the bottom. 3. Hold the car with its back wheels on the start line. 4. Let go without pushing. 5. Measure from the end of the ramp to the back of the car. 6. Repeat 3 times for each surface."],
  ["Results","A table with units in the headings, all trials and averages, plus a graph.","Table: Surface | Trial 1 (cm) | Trial 2 (cm) | Trial 3 (cm) | Average (cm). Column graph of average distance for each surface."],
  ["Conclusion","What do your results show? Use data. Was your hypothesis supported?","The car travelled furthest on tiles (average 238 cm) and shortest on sandpaper (47 cm). The rougher the surface, the shorter the distance. This supports my hypothesis because rougher surfaces have more friction."],
  ["Evaluation","What went wrong or could be improved? Was it a fair test? Were results reliable?","Some trials were different because the car sometimes veered sideways. To improve, use guide rails and do 5 trials. Our results were fairly reliable because the 3 trials were close for most surfaces."]];
const reportTabs = (data) => tabs(data.map(p=>[p[0],`<p class="lead">${p[1]}</p><div class="box tint push"><h3 class="ink">Example</h3><p>${p[2]}</p></div>`]));

{ n:9, title:"Planning the friction investigation",
  li:"Plan a fair test investigating friction.",
  sc:["I can identify the independent, dependent and controlled variables.","I can write a hypothesis using If... then... because...","I can set up a results table with units."],

   notes:""},
  {mode:"learn", h:"Our investigation question",
   html:`<div class="box fill" style="justify-content:center;align-items:center;text-align:center"><p class="small" style="font-family:var(--f-mono);color:var(--accent);font-weight:700">PRACTICAL 1</p><p class="spot" style="font-size:4.2cqw">How does surface type affect the distance travelled by a toy car down a ramp?</p><p class="lead">Equipment: toy cars, ramps, 5 surfaces, measuring tapes, an online simulator.</p></div>`,
   notes:"Show the actual equipment. Let students handle the surfaces and feel the difference."},
  {mode:"watch", h:"Variables in science",

   notes:"Trick to remember: I change the Independent variable. The Dependent variable Depends on it."},
  {mode:"learn", h:"Three kinds of variables",
   html:`<div class="grid3"><div class="fcard push"><span class="tag">I change it</span><h3 style="font-size:2.6cqw">Independent variable</h3><p>The ONE thing you change on purpose.</p></div><div class="fcard fric"><span class="tag">I measure it</span><h3 style="font-size:2.6cqw">Dependent variable</h3><p>What you measure to see the effect.</p></div><div class="fcard grav"><span class="tag">I keep them the same</span><h3 style="font-size:2.6cqw">Controlled variables</h3><p>Everything else that could affect the result. Keeping these the same makes it a <b>fair test</b>.</p></div></div>`,

  {mode:"whole", h:"Sort the variables for our investigation", init:"sort",
   data:{zones:[["iv","Independent","push"],["dv","Dependent","fric"],["cv","Controlled","grav"]],
     items:[["Type of surface","iv"],["Distance the car travels (cm)","dv"],["Height of the ramp","cv"],["The same toy car","cv"],["Release point on the ramp","cv"],["Letting go without pushing","cv"],["How distance is measured","cv"],["Length of the ramp","cv"]]},
   html:`<p class="small">Click a card, then a box. Press Check when the class agrees.</p>${sortUI}`,

  {mode:"write", timer:5, h:"Aim and hypothesis",
   html:`<div class="grid2 fill"><div class="box"><h3>Aim</h3><p class="starter">To investigate how ___ affects ___.</p><h3>Hypothesis</h3><p class="starter">If the surface is ___, then the car will travel ___, because ___.</p><p class="small">Use your prediction from Lesson 7 to help you.</p></div>${rv("Example hypothesis","If the surface is rougher, then the car will travel a shorter distance, because rough surfaces create more friction, which slows the car down more quickly.")}</div>`,
   notes:"The 'because' must use science (friction). 'Because I think so' doesn't count."},
  {mode:"learn", h:"Method",
   html:`<div class="grid2 fill"><div class="box">${steps(["Set the ramp to 20 cm high using a ruler.","Place the first surface flat at the bottom of the ramp.","Hold the car with its back wheels on the start line.","Let go. <b>Don't push.</b>","Measure from the end of the ramp to the <b>back</b> of the car.","Repeat 3 times. Then change surfaces."])}</div>
   <div class="box"><h3>Safety</h3><ul><li>Keep walkways clear of ramps and tapes.</li><li>Cars stay on the floor or desk.</li><li>Sandpaper can scratch: handle by the edges.</li></ul><h3>Roles</h3><p>Launcher, measurer, recorder, checker.</p></div></div>`,
   notes:"Students copy or glue in the method. Discuss why measuring to the back of the car matters (consistency)."},
  {mode:"write", timer:5, h:"Set up your results table",
   html:`<div class="tablewrap"><table class="ctable"><thead><tr><th>Surface</th><th>Trial 1 (cm)</th><th>Trial 2 (cm)</th><th>Trial 3 (cm)</th><th>Average (cm)</th></tr></thead><tbody>${["Smooth tiles","Cardboard","Carpet","Towel","Sandpaper"].map(t=>`<tr><td>${t}</td><td></td><td></td><td></td><td></td></tr>`).join("")}</tbody></table></div>

   notes:"Rule up with a ruler and pencil."},
  {mode:"learn", h:"Preview: the online simulator",
   html:`<div class="grid2 fill"><div class="box"><h3>Two ways to test</h3><p>Next lesson we test real cars. In Lesson 11 we test the same idea on a <b>simulator</b> and compare.</p><p class="lead">Think: how could a simulation be <b>better</b> than real cars? How could it be <b>worse</b>?</p></div><div class="box"><h3>Simulators we'll use</h3><ul><li>The toy car ramp simulator built into these slides</li><li>PhET <i>Forces and Motion: Basics</i> (Friction screen)</li></ul></div></div>`,
   notes:"Seed the strengths and limitations discussion for Lesson 11."},
  {mode:"check", h:"Exit: check your plan",
   html:`<ul class="checklist" style="font-size:2cqw"><li>My aim says what I am investigating.</li><li>My hypothesis uses If... then... because...</li><li>I have named the IV, DV and at least 3 controlled variables.</li><li>My results table has units in the headings.</li></ul><p class="small">Show your partner. Anything missing gets finished before next lesson.</p>`,
   notes:"Investigation plan is the assessment. Collect or photograph plans to check before the practical."}
  ]},

{ n:10, title:"Conducting the friction practical",
  li:"Collect data from a physical friction investigation.",
  sc:["I can follow a method to carry out a fair test.","I can measure accurately and record data in a table."],
  prep:"Per group: ramp, toy car, 5 surfaces, measuring tape, books or blocks to set height, results sheet. Floor space marked out.",
  slides:[
  {mode:"check", h:"Before we start",
   html:`<div class="grid3">${[["What is our independent variable?","Type of surface."],["What do we measure?","Distance travelled (cm) from the end of the ramp to the back of the car."],["Name two things we keep the same.","Ramp height, car, release point, no pushing."]].map(c=>rv(c[0],c[1])).join("")}</div>`,
   notes:""},
  {mode:"group", h:"Group roles",
   html:`<div class="grid4">${[["Launcher","Holds the car on the start line and lets go without pushing.","push"],["Measurer","Measures to the back of the car, reads the tape at eye level.","fric"],["Recorder","Writes every result in the table straight away.","grav"],["Checker","Checks the ramp height and surface before every trial. Watches for unfair tests.","air"]].map(c=>`<div class="fcard ${c[2]}"><h3>${c[0]}</h3><p>${c[1]}</p></div>`).join("")}</div><p class="lead">Swap roles after each surface so everyone has a turn.</p>`,
   notes:"Groups of 4. Groups of 3 combine Checker and Launcher."},
  {mode:"learn", h:"Measure like a scientist",
   html:`<div class="grid2 fill"><div class="box">${steps(["Start the tape at the <b>end of the ramp</b>, not the start.","Measure in a straight line to the <b>back</b> of the car.","Read at eye level, to the nearest <b>centimetre</b>.","If the car hits something or goes off the surface, <b>redo</b> the trial."])}</div>
   <div class="box"><h3>Spot the anomaly</h3><p>If one trial is very different from the others, check what happened. Note it, then do one more trial.</p><p class="small">Example: 85 cm, 88 cm, <b>41 cm</b> (car bumped a chair leg).</p></div></div>`,

{ n:12, title:"Friction report write-up",
  li:"Write a scientific report using evidence from the investigation.",
  sc:["I can write each section of a scientific report.","I can write a conclusion that uses data as evidence.","I can evaluate my investigation and suggest improvements."],
  prep:"Report template (printed or digital). Students' plans, results and graphs from Lessons 9 to 11.",
  slides:[
  {mode:"learn", h:"The parts of a scientific report",
   html:`<div class="grid4">${REPORT_PARTS.map((p,i)=>`<div class="box"><span class="small" style="font-family:var(--f-mono);color:var(--accent);font-weight:700">${i+1}</span><h3>${p[0]}</h3><p class="small">${p[1]}</p></div>`).join("")}<div class="box tint fric"><h3 class="ink">You already have...</h3><p class="small">Aim, hypothesis, variables, method (Lesson 9). Results and graph (Lessons 10 and 11).</p></div></div>`,
   notes:"Today is mostly about the Conclusion and Evaluation, the two hardest sections."},
  {mode:"learn", h:"Each section, with an example",
   html:reportTabs(REPORT_PARTS),
   notes:"Click through the tabs. Students check their draft against each example."},
  {mode:"learn", h:"Writing a strong conclusion",
   html:`<div class="grid2 fill"><div class="box"><h3>Four parts</h3>${steps(["<b>Pattern:</b> What happened to the DV as the IV changed?","<b>Data:</b> Quote numbers from your results.","<b>Science:</b> Explain why, using friction.","<b>Hypothesis:</b> Was it supported or not?"])}</div>
   <div class="grid2">${[["Weak","The sandpaper was the slowest."],["Strong","As the surface got rougher, the distance travelled decreased. The car went 238 cm on tiles but only 47 cm on sandpaper. Rough surfaces create more friction, which slows the car faster. This supports my hypothesis."]].map(c=>`<div class="box ${c[0]==="Strong"?"tint push":""}"><h3>${c[0]}</h3><p>${c[1]}</p></div>`).join("")}</div></div>`,
   notes:"Ask: what makes the strong one strong? Students highlight each of the four parts in the strong example."},
  {mode:"learn", h:"Writing an evaluation",
   html:`<div class="grid3">${[["Fair test?","Were all controlled variables really kept the same? Which one was hardest to control?"],["Reliable?","Were your 3 trials close together? Any anomalies? What caused them?"],["Improve","Give a specific improvement and say how it would help. Not 'be more careful'."]].map(c=>`<div class="box"><h3>${c[0]}</h3><p>${c[1]}</p></div>`).join("")}</div>${rv("Example improvement","Use tape lanes on each surface so the car can't veer sideways. This would make the distances more consistent and the results more reliable.")}`,
   notes:"Ban 'human error' with no detail. They must name the error."},
  {mode:"write", timer:25, h:"Write your report",
   html:`<div class="grid2 fill"><div class="box"><h3>Work through in order</h3><ul class="checklist"><li>Aim</li><li>Hypothesis</li><li>Variables</li><li>Method (with a labelled diagram)</li><li>Results table and graph</li><li>Conclusion (pattern, data, science, hypothesis)</li><li>Evaluation (fair, reliable, improve)</li></ul></div>
   <div class="box"><h3>Teacher conferencing</h3><p>I'll come to each table. Have your <b>conclusion</b> ready to show me.</p><p class="small">Stuck? Use the examples on the tabs slide.</p></div></div>`,
   notes:"Conference with 6 to 8 students. Prioritise those who struggled with the exit tickets."},
  {mode:"check", h:"Self-check before you submit",
   html:`<div class="grid2 fill"><ul class="checklist" style="font-size:1.8cqw"><li>Every table and graph has units.</li><li>My conclusion quotes at least two numbers.</li><li>I used the word <b>friction</b> to explain the pattern.</li><li>I said whether my hypothesis was supported.</li><li>My improvement is specific.</li></ul>${exitFist(["I can write each section of a scientific report.","I can write a conclusion that uses data as evidence.","I can evaluate my investigation and suggest improvements."])}</div>`,
   notes:"Practical Report 1 submission or draft. Final edits allowed in Lesson 26."}
  ]}
);
/* ---------- Week 4: Force diagrams and motion ---------- */
const W=(s=2)=>["down",s,"Weight","grav"], SUP=(s=2)=>["up",s,"Support force","push"];
const FD_INTRO=[
  {name:"Book on a table",obj:"book",motion:"Still",forces:[W(2),SUP(2)],state:"Balanced",why:"Gravity pulls the book down. The table pushes up with an equal support force. The arrows are the same length, so the book stays still.",hint:"Which force does EVERY object on Earth have?"},
  {name:"Falling apple",obj:"apple",motion:"Falling, speeding up",forces:[W(2.5),["up",.6,"Air resistance","air"]],state:"Unbalanced",why:"Weight is much bigger than air resistance, so the apple speeds up as it falls."},
  {name:"Rolling car, slowing",obj:"car",motion:"Moving right, slowing down",forces:[W(1.6),SUP(1.6),["left",1.6,"Friction","fric"]],state:"Unbalanced",why:"Up and down are balanced, but nothing pushes the car forward. Friction acts backwards, so the car slows down."},
  {name:"Pushed box, speeding up",obj:"box",motion:"Moving right, speeding up",forces:[W(1.6),SUP(1.6),["right",2.5,"Push","push"],["left",1,"Friction","fric"]],state:"Unbalanced",why:"The push (right) is bigger than friction (left), so the box speeds up to the right. Up and down are balanced."}];
const FD_BAL=[
  {name:"Hanging lamp",obj:"lamp",motion:"Still",forces:[["up",2,"Tension","push"],W(2)],state:"Balanced",why:"The cord pulls up (tension) as hard as gravity pulls down. Equal arrows, so the lamp stays still."},
  {name:"Car at steady speed",obj:"car",motion:"Moving right at a steady 60 km/h",forces:[W(1.6),SUP(1.6),["right",2.2,"Driving force","push"],["left",2.2,"Friction + air resistance","fric"]],state:"Balanced",why:"The driving force equals friction and air resistance together. Balanced forces, so the speed stays the same. It is moving, but its motion does not change."},
  {name:"Skydiver at top speed",obj:"sky",motion:"Falling at a steady speed",forces:[W(2.6),["up",2.6,"Air resistance","air"]],state:"Balanced",why:"Air resistance has grown until it equals weight. Balanced, so the skydiver falls at a steady speed (terminal velocity)."},
  {name:"Floating boat",obj:"boat",motion:"Still",forces:[W(2.2),["up",2.2,"Upthrust (water pushes up)","push"]],state:"Balanced",why:"The water pushes up (upthrust) with a force equal to the boat's weight, so it floats without rising or sinking."},
  {name:"Person standing",obj:"person",motion:"Still",forces:[W(2.3),SUP(2.3)],state:"Balanced",why:"The ground pushes up with a support force equal to the person's weight."}];
const FD_UNBAL=[
  {name:"Rocket launch",obj:"rocket",motion:"Lifting off, speeding up",forces:[["up",1.9,"Thrust","push"],["down",1.1,"Weight","grav"]],state:"Unbalanced",why:"Thrust up is bigger than weight down. The net force is upwards, so the rocket speeds up."},
  {name:"Skydiver just jumped",obj:"sky",motion:"Falling, speeding up",forces:[W(2.6),["up",.6,"Air resistance","air"]],state:"Unbalanced",why:"At first air resistance is tiny. Weight is much bigger, so the skydiver speeds up."},
  {name:"Parachute opens",obj:"chute",motion:"Falling, slowing down",forces:[["up",1.8,"Air resistance","air"],["down",1,"Weight","grav"]],state:"Unbalanced",why:"The big canopy makes air resistance bigger than weight. The net force is up, so the parachutist slows down (still falling, just slower)."},
  {name:"Car braking",obj:"car",motion:"Moving right, slowing down fast",forces:[W(1.6),SUP(1.6),["left",2.6,"Braking friction","fric"]],state:"Unbalanced",why:"Braking friction acts backwards and nothing pushes forward. The net force is backwards, so the car slows down."},
  {name:"Swimmer pushing off",obj:"swimmer",motion:"Moving right, speeding up",forces:[["right",2.5,"Push off the wall","push"],["left",.8,"Water resistance","air"]],state:"Unbalanced",why:"The push off the wall is bigger than water resistance, so the swimmer speeds up. (Weight and upthrust also act, but they balance.)"}];

{ n:13, title:"Introducing force diagrams",

   <div class="simview"><svg viewBox="0 0 400 300" role="img" aria-label="A box with a long push arrow and a short friction arrow"><rect x="150" y="110" width="100" height="80" rx="4" fill="color-mix(in srgb,var(--fric) 35%,var(--surface))" stroke="var(--ink)" stroke-width="3"/>${arrowSVG(250,150,370,150,"var(--push)","Push 30 N","ex1")}${arrowSVG(150,150,90,150,"var(--fric)","Friction 15 N","ex2")}<line x1="0" y1="190" x2="400" y2="190" stroke="var(--ink)" stroke-width="2"/></svg></div></div>`,
   notes:"Students copy the five rules. The push arrow is twice as long as friction because the force is twice as big."},
  {mode:"watch", h:"How do you draw a force diagram?",

  {mode:"whole", h:"Build it arrow by arrow", init:"fdiag", data:FD_INTRO,

  {mode:"talk", timer:3, h:"Spot the mistake",

   notes:"Mini whiteboards first, then into books with a ruler. Force diagram practice is today's evidence."},
  {mode:"check", h:"Exit ticket",
   html:`<div class="grid2 fill"><div class="box"><p class="lead">Draw a force diagram for a skateboarder rolling to a stop on flat ground.</p>${rv("Check","Weight down and support force up (equal). Friction arrow pointing backwards. No forward arrow: nothing is pushing them along.")}</div>${exitFist(["I can draw force arrows that show direction and size.","I can label each arrow with the name of the force."])}</div>`,

{ n:14, title:"Balanced force diagrams",
  li:"Draw force diagrams for balanced situations.",
  sc:["I can draw balanced force diagrams with equal and opposite arrows.","I can explain why motion does or does not change."],
  prep:"Mini whiteboards. Worksheet with 6 balanced scenarios.",
  slides:[
  {mode:"check", h:"Retrieval: arrow rules",
   html:`<div class="grid4">${[["Where does an arrow start?","On the object."],["What does a longer arrow mean?","A bigger force."],["What must every arrow have?","A label."],["Is 'motion' a force?","No. Motion is what forces change."]].map(c=>rv(c[0],c[1])).join("")}</div>`,
   notes:""},
  {mode:"learn", h:"What balanced looks like",
   html:`<div class="grid2 fill"><div class="box"><p class="def">In a <b>balanced</b> diagram, every arrow has a partner that is the <b>same length</b> pointing the <b>opposite way</b>.</p><p class="lead">Net force = 0 N</p><p>So the motion does <b>not change</b>: still objects stay still, moving objects keep the same speed and direction.</p></div>
   <div class="simview"><svg viewBox="0 0 400 300" role="img" aria-label="Box with four equal arrows"><rect x="150" y="110" width="100" height="80" rx="4" fill="color-mix(in srgb,var(--fric) 35%,var(--surface))" stroke="var(--ink)" stroke-width="3"/>${arrowSVG(200,110,200,40,"var(--push)","Support","b1")}${arrowSVG(200,190,200,260,"var(--grav)","Weight","b2")}${arrowSVG(250,150,320,150,"var(--push)","Push","b3")}${arrowSVG(150,150,80,150,"var(--fric)","Friction","b4")}</svg></div></div>`,
   notes:"This box could be still, or being pushed at a steady speed. The diagram is the same!"},
  {mode:"whole", h:"Balanced situations", init:"fdiag", data:FD_BAL,
   html:fdUI,
   notes:"The car at steady speed and the skydiver are the key misconception busters: moving but balanced."},
  {mode:"group", timer:8, h:"Whiteboard challenge",
   html:`<p>Groups of 3. Draw each one on a whiteboard. Hold up when the timer beeps for each.</p><div class="grid3">${[["A plane flying level at a steady speed","Lift up = weight down. Thrust forward = air resistance back."],["A spider hanging still on its thread","Tension up = weight down."],["A cyclist riding at a steady 20 km/h","Pedal force forward = friction + air resistance back. Weight = support."]].map(c=>`<div class="box"><p class="lead">${c[0]}</p>${rv("Check",c[1])}</div>`).join("")}</div>`,
   notes:"The plane has four forces, a stretch for confident groups."},
  {mode:"write", timer:6, h:"Why doesn't the motion change?",
   html:`<div class="grid2 fill"><div class="box"><p class="lead">Explain why a car on cruise control keeps going at exactly 100 km/h.</p><p class="starter">The forces on the car are ___ because ___. This means the net force is ___, so the car's motion ___.</p></div>${rv("Model answer","The forces on the car are balanced because the driving force forwards is the same size as friction and air resistance backwards. This means the net force is zero, so the car's motion does not change: it keeps moving at the same speed in the same direction.")}</div>`,
   notes:"Worksheet / written explanation evidence."},
  {mode:"check", h:"Quick quiz", init:"quiz",
   data:[["A book sits on a shelf. The forces are...",["Unbalanced","Balanced","Zero","Only gravity"],1,"Weight down and support up are equal."],["A skydiver falls at a steady speed. Air resistance is...",["Bigger than weight","Smaller than weight","Equal to weight","Zero"],2,"Steady speed means balanced."],["In a balanced diagram, the arrows are...",["All pointing down","Equal and opposite","Different lengths","Not labelled"],1,"Each arrow has an equal partner pointing the opposite way."],["Balanced forces mean an object...",["Must be still","Must be speeding up","Keeps the same motion","Changes direction"],2,"Still stays still; moving keeps moving steadily."]],
   html:quizUI,

   notes:""}
  ]},

  {mode:"learn", h:"Unbalanced: the bigger arrow wins",
   html:`<div class="grid3">${[["Speeds up","The bigger force points the same way as the motion.","push"],["Slows down","The bigger force points against the motion.","fric"],["Changes direction","A force acts from the side (like turning a corner or hitting a ball).","grav"]].map(c=>`<div class="fcard ${c[2]}"><h3 style="font-size:2.4cqw">${c[0]}</h3><p>${c[1]}</p></div>`).join("")}</div>
   <p class="def"><b>Net force</b> = bigger force &minus; smaller force, in the direction of the bigger force.</p><p class="small">e.g. 50 N right and 20 N left: net force = 30 N to the right.</p>`,

  {mode:"whole", h:"Net force with the tug of war", init:"tug", data:{l:20,r:50},
   html:tugUI,
   notes:"Ask students to calculate the net force before each change. Try 70 left and 30 right."},
  {mode:"whole", h:"Unbalanced situations", init:"fdiag", data:FD_UNBAL,
   html:fdUI,
   notes:"Parachute opening is the hardest: the net force is upwards but the parachutist is still falling, just slowing down."},
  {mode:"check", h:"Mini whiteboard check", init:"vote",
   data:[["A ball is kicked along the grass. Draw it just after the kick, rolling and slowing.","Weight and support balanced. Friction backwards. No forward force once the foot has left the ball."],["A lift starts to go up.","Tension up is bigger than weight down: unbalanced upwards."],["A tennis ball hits a racquet and bounces back.","The racquet's push is much bigger than air resistance: direction changes."],["A car speeds up away from traffic lights.","Driving force forward is bigger than friction and air resistance backwards."],["40 N left and 10 N right. What is the net force?","30 N to the left."]],
   html:`<p>Draw the force diagram on your whiteboard. Show me on "3, 2, 1".</p>${voteUI("Show answer")}`,

  {mode:"group", timer:8, h:"Small group discussion",
   html:`<div class="grid2 fill"><div class="box"><h3>Discuss and agree</h3><p class="lead">A cyclist goes down a hill without pedalling, getting faster and faster. Then she reaches a steady top speed.</p>${steps(["Draw a force diagram at the start.","Draw one at top speed.","What changed, and why?"])}</div>${rv("Check","At the start, gravity pulling her down the hill is bigger than air resistance and friction: unbalanced, she speeds up. As she gets faster, air resistance grows until the forces balance, so she reaches a steady top speed.")}</div>`,

  {mode:"check", h:"Exit ticket",

LESSONS.push(
{ n:17, title:"Magnetic forces",
  li:"Explore magnetic force as a force acting at a distance.",

  prep:"Per group: 2 bar magnets, a tray of test objects (iron nail, steel paperclip, aluminium foil, copper wire, plastic, wood, steel spoon, 5c coin), paper, cardboard, a compass. Practical sheet.",
  slides:[
  {mode:"check", h:"Retrieval: force diagrams",
   html:`<div class="grid3">${[["A rocket's thrust is bigger than its weight. What happens?","It speeds up upwards."],["Which force always points down on Earth?","Weight (gravity)."],["Name the three non-contact forces.","Gravity, magnetic force, electrostatic force."]].map(c=>rv(c[0],c[1])).join("")}</div>`,
   notes:"The last question introduces this week."},
  {mode:"whole", h:"Predict: magnetic or not?", init:"sort",
   data:{zones:[["m","Attracted to a magnet","mag"],["n","Not attracted",""]],
     items:[["Iron nail","m"],["Steel paperclip","m"],["Aluminium can","n"],["Copper wire","n"],["Plastic ruler","n"],["Steel spoon","m"],["Gold ring","n"],["Nickel","m"],["Wooden pencil","n"],["Australian 5c coin","n"]],
     note:"Surprised? Only some metals are magnetic: mainly iron, steel, nickel and cobalt."},
   html:`<p class="small">Sort your predictions now. We'll check them in the practical.</p>${sortUI}`,
   notes:"Australian silver coins are cupronickel (75% copper), so they are not attracted by an ordinary magnet. Many students expect all metals to be magnetic."},
  {mode:"learn", h:"How magnets work",
   html:`<div class="grid3"><div class="fcard mag"><h3>Two poles</h3><p>Every magnet has a <b>north</b> (N) and a <b>south</b> (S) pole. The force is strongest at the poles.</p></div><div class="fcard mag"><h3>Attract and repel</h3><p><b>Unlike</b> poles attract (N and S). <b>Like</b> poles repel (N and N, or S and S).</p></div><div class="fcard mag"><h3>Magnetic field</h3><p>The space around a magnet where its force acts. It works through air, paper, even your hand.</p></div></div>
   <p class="def">Magnetic force is a <b>non-contact</b> force: it acts across a gap.</p>`,
   notes:"Iron filings on paper over a bar magnet show the field if you have them."},
  {mode:"whole", h:"Attract or repel?", init:"magnet",
   html:magUI,
   notes:"Flip the magnets and have students predict each time with thumbs up (attract) or down (repel)."},
  {mode:"watch", h:"What makes things magnetic?",
   html:vid("Kll5A6xX9cY","Forces: Magnetism, What Makes Things Magnetic?","Miacademy",["Which materials are magnetic?","What is a magnetic field?","How does a compass work?"]),
   notes:""},
  {mode:"prac", timer:15, h:"Practical: test magnets and materials",
   html:`<div class="grid2 fill"><div class="box"><h3>Part A: materials</h3>${steps(["Touch each object with a magnet.","Record: attracted or not attracted.","Compare with your prediction."])}<h3>Part B: through materials</h3>${steps(["Put a paperclip under 1 sheet of paper. Can the magnet still move it?","Try 5 sheets, then cardboard, then your hand."])}</div>
   <div class="tablewrap"><table class="ctable"><thead><tr><th>Object</th><th>Material</th><th>Prediction</th><th>Result</th></tr></thead><tbody>${["Nail","Paperclip","Foil","Copper wire","Ruler","Spoon","Coin"].map(t=>`<tr><td>${t}</td><td></td><td></td><td></td></tr>`).join("")}</tbody></table></div></div>`,
   notes:"Practical sheet is the assessment. Keep magnets away from phones, laptops and bank cards."},
  {mode:"talk", timer:3, h:"What did we find?",
   html:`<div class="grid3">${[["Which materials were magnetic?","Iron and steel objects (and nickel). Other metals like aluminium and copper were not."],["Did the force work through paper?","Yes, but it got weaker as we added more layers (more distance)."],["Did the magnet need to touch the clip?","No. It pulled across a gap: a non-contact force."]].map(c=>rv(c[0],c[1])).join("")}</div>`,
   notes:""},
  {mode:"learn", h:"Magnets in real life",
   html:tabs([["MRI scanners",`<p class="lead">Huge magnets help doctors see inside the body without surgery.</p>`],["Maglev trains",`<p class="lead">Magnets lift the train above the track and push it along. No wheels touching means almost no friction, so it can go over 400 km/h.</p>`],["Recycling",`<p class="lead">Giant electromagnets pull steel cans out of mixed rubbish so they can be recycled.</p>`],["Compass",`<p class="lead">Earth acts like a giant magnet. A compass needle is a small magnet that lines up with Earth's magnetic field.</p>`],["At home",`<p class="lead">Fridge doors, cupboard catches, speakers, headphones and electric motors all use magnets.</p>`]]),
   notes:"Ask students to add one more example they can think of."},
  {mode:"check", h:"Exit ticket",
   html:`<div class="grid3">${[["N and S poles facing: attract or repel?","Attract."],["Name two magnetic materials.","Iron, steel, nickel, cobalt."],["Why is magnetism a non-contact force?","It acts across a gap without touching."]].map(c=>rv(c[0],c[1])).join("")}</div>${exitFist(["I can describe how magnets attract and repel.","I can identify which materials are magnetic.","I can give real-life uses of magnets."])}`,
   notes:""}
  ]},

{ n:18, title:"Electrostatic force",

  sc:["I can explain how objects become charged.","I can describe how charged objects attract and repel.","I can compare electrostatic and magnetic forces."],
  prep:"Balloons (one per pair), small pieces of tissue paper, a plastic comb, an empty aluminium drink can, a woollen jumper or cloth. Comparison chart.",
  slides:[
  {mode:"check", h:"Retrieval: magnets",
   html:`<div class="grid3">${[["Like poles...","Repel."],["Is aluminium magnetic?","No."],["Name a real-life use of magnets.","MRI, maglev trains, recycling, compass, fridge doors."]].map(c=>rv(c[0],c[1])).join("")}</div>`,
   notes:""},
  {mode:"prac", timer:10, h:"Static electricity challenges",
   html:`<div class="grid2 fill"><div class="box">${steps(["Rub a balloon on your hair or a jumper for 10 seconds.","Hold it near your hair. What happens?","Hold it over tiny bits of tissue paper.","Lay a drink can on its side. Can the balloon roll it without touching?","Rub two balloons. Hang them side by side. What happens?"])}</div><div class="box"><h3>Record</h3><p>For each challenge: did it <b>attract</b> or <b>repel</b>? Did the objects touch?</p><p class="small">Works best on a dry day. A humid room makes charges leak away.</p></div></div>`,

  {mode:"learn", h:"How objects become charged",
   html:`<div class="grid2 fill"><div style="display:flex;flex-direction:column;gap:1.2cqw"><div class="box"><h3>Tiny charges in everything</h3><p>All matter contains <b>positive</b> (+) and <b>negative</b> (&minus;) charges. Usually they are equal, so the object is <b>neutral</b>.</p></div><div class="box"><h3>Rubbing moves electrons</h3><p>Rubbing can move tiny negative particles called <b>electrons</b> from one object to another.</p></div></div>
   <div class="grid2">${[["Like charges","Repel. (+ and +, or &minus; and &minus;)","elec"],["Unlike charges","Attract. (+ and &minus;)","mag"]].map(c=>`<div class="fcard ${c[2]}"><h3 style="font-size:2.6cqw">${c[0]}</h3><p class="lead">${c[1]}</p></div>`).join("")}</div></div>
   <p class="def"><b>Electrostatic force</b> is a non-contact force between charged objects.</p>`,

   notes:"Lightning is the big natural example."},
  {mode:"write", timer:8, h:"Comparison chart: electrostatic vs magnetic", init:"cells",
   html:`<div class="tablewrap"><table class="ctable"><thead><tr><th></th><th><span class="fbadge elec">Electrostatic force</span></th><th><span class="fbadge mag">Magnetic force</span></th></tr></thead><tbody>${[["Contact or non-contact?","Non-contact","Non-contact"],["What causes it?","Charged objects (extra or missing electrons)","Magnets and magnetic materials"],["Attract?","Unlike charges (+ and &minus;)","Unlike poles (N and S)"],["Repel?","Like charges","Like poles"],["Which objects?","Almost any material once charged","Only iron, steel, nickel, cobalt"],["How long does it last?","Short time, charge leaks away","Permanent magnets last for years"]].map(r=>`<tr><td><b>${r[0]}</b></td><td class="rcell">${r[1]}</td><td class="rcell">${r[2]}</td></tr>`).join("")}</tbody></table></div><div class="row"><button class="btn" id="cellsAll">Reveal all</button><span class="small">Fill in your chart first, then click to check.</span></div>`,

  {mode:"learn", h:"Electrostatic force in real life",

   notes:""}
  ]},

{ n:19, title:"How forces change motion",
  li:"Explain how forces affect speed and direction.",
  sc:["I can describe five ways a force can change motion.","I can explain a scenario using balanced and unbalanced forces."],

  {mode:"learn", h:"What can a force do to motion?",
   html:`<div class="grid3">${[["Start","A still object starts moving.","push"],["Stop","A moving object comes to rest.","fric"],["Speed up","Moves faster.","air"],["Slow down","Moves slower.","grav"],["Change direction","Turns, bounces or curves.","mag"],["Change shape","Squashes, stretches or bends (not motion, but still an effect).","elec"]].map(c=>`<div class="fcard ${c[2]}"><h3 style="font-size:2.4cqw">${c[0]}</h3><p>${c[1]}</p></div>`).join("")}</div><p class="lead">All of these need an <b>unbalanced</b> force.</p>`,

     items:[["A goalie catching a ball","stop"],["A car pulling away from a stop sign","start"],["A cricket ball hit for six","dir"],["A bike rolling up a hill","slow"],["A skydiver just after jumping","fast"],["A parachute opening","slow"],["A ball bouncing off a wall","dir"],["Pushing a stalled car","start"],["A plane landing on a runway","slow stop"],["A sled sliding down a snowy slope","fast"]],

   notes:"Challenge students: set the sliders to make the cart start moving left. Make it stay still with 70 N on one side. What's the smallest unbalanced force you can make?"},
  {mode:"group", timer:8, h:"Scenario analysis",
   html:`<p>Pairs. For each scenario: name the forces, balanced or unbalanced, and what happens to the motion.</p><div class="grid2">${[
     ["A shopping trolley is pushed, then let go.","Push then none. Friction is unbalanced backwards, so it slows down and stops."],
     ["A soccer ball rolls across grass and stops.","Friction from the grass and air resistance act backwards: unbalanced, so it slows and stops."],

/* ---------- Week 6: Practical 2, parachute investigation ---------- */
const CHUTE_DATA=[[20,[1.78,1.91,1.84],1.84],[30,[2.40,2.51,2.38],2.43],[40,[2.95,2.81,3.62],2.88],[50,[3.15,3.27,3.21],3.21],[60,[3.39,3.50,3.41],3.43]];
const CHUTE_REPORT=[["Aim","What are you trying to find out?","To investigate how the size of a parachute's canopy affects how long it takes to fall 2 m."],
  ["Hypothesis","If... then... because...","If the canopy is bigger, then the parachute will take longer to fall, because a bigger surface area creates more air resistance pushing up against gravity."],
  ["Variables","IV, DV and controlled variables.","IV: canopy size (cm). DV: fall time (s). CV: drop height (2 m), canopy material, string length, number of paper clips, same person timing, no wind."],
  ["Method","Numbered steps with a labelled diagram.","1. Cut square plastic canopies of 20, 30, 40, 50 and 60 cm. 2. Tie four 30 cm strings to the corners. 3. Attach 3 paper clips. 4. Hold the canopy open at 2 m. 5. Drop and start the stopwatch at the same time. 6. Stop when it touches the floor. 7. Repeat 3 times for each size."],
  ["Results","Table with units and averages, plus a line graph.","Table: Canopy size (cm) | Trial 1 (s) | Trial 2 (s) | Trial 3 (s) | Average (s). Line graph of average fall time against canopy size."],
  ["Conclusion","Pattern, data, science, hypothesis.","As the canopy got bigger, the fall time increased. The 20 cm canopy took 1.84 s on average but the 60 cm canopy took 3.43 s. A bigger canopy has more air resistance, so it falls more slowly. This supports my hypothesis. The increase got smaller for the biggest canopies."],

{ n:22, title:"Building and testing parachutes",
  li:"Collect data from a parachute investigation.",
  sc:["I can build parachutes that only differ in my independent variable.","I can time drops carefully and record repeated trials."],
