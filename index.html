LESSONS.push(
{ n:17, title:"Magnetic forces",
  li:"Explore magnetic force as a force acting at a distance.",
  sc:["I can describe how magnets attract and repel.","I can identify which materials are magnetic.","I can give real-life uses of magnets."],
  prep:"Per group: 2 bar magnets, a tray of test objects (iron nail, steel paperclip, aluminium foil, copper wire, plastic, wood, steel spoon, 5c coin), paper, cardboard, a compass. Practical sheet.",
  slides:[
  {mode:"check", h:"Retrieval: force diagrams",
   html:`<div class="grid3">${[["A rocket's thrust is bigger than its weight. What happens?","It speeds up upwards."],["Which force always points down on Earth?","Weight (gravity)."],["Name the three non-contact forces.","Gravity, magnetic force, electrostatic force."]].map(c=>rv(c[0],c[1])).join("")}</div>`,
   notes:"The last question introduces this week."},
  {mode:"whole", h:"Predict: magnetic or not?", init:"sort",
   data:{zones:[["m","Attracted to a magnet","mag"],["n","Not attracted",""]],
     items:[["Iron nail","m"],["Steel paperclip","m"],["Aluminium can","n"],["Copper wire","n"],["Plastic ruler","n"],["Steel spoon","m"],["Gold ring","n"],["Nickel","m"],["Wooden pencil","n"],["Australian 5c coin","n"]],
     note:"Surprised? Only some metals are magnetic: mainly iron, steel, nickel and cobalt."},
   html:`<p class="small">Sort your predictions now. We'll check them in the practical.</p>${sortUI}`,
   notes:"Australian silver coins are cupronickel (75% copper), so they are not attracted by an ordinary magnet. Many students expect all metals to be magnetic."},
  {mode:"learn", h:"How magnets work",
   html:`<div class="grid3"><div class="fcard mag"><h3>Two poles</h3><p>Every magnet has a <b>north</b> (N) and a <b>south</b> (S) pole. The force is strongest at the poles.</p></div><div class="fcard mag"><h3>Attract and repel</h3><p><b>Unlike</b> poles attract (N and S). <b>Like</b> poles repel (N and N, or S and S).</p></div><div class="fcard mag"><h3>Magnetic field</h3><p>The space around a magnet where its force acts. It works through air, paper, even your hand.</p></div></div>
   <p class="def">Magnetic force is a <b>non-contact</b> force: it acts across a gap.</p>`,
   notes:"Iron filings on paper over a bar magnet show the field if you have them."},
  {mode:"whole", h:"Attract or repel?", init:"magnet",
   html:magUI,
   notes:"Flip the magnets and have students predict each time with thumbs up (attract) or down (repel)."},
  {mode:"watch", h:"What makes things magnetic?",
   html:vid("Kll5A6xX9cY","Forces: Magnetism, What Makes Things Magnetic?","Miacademy",["Which materials are magnetic?","What is a magnetic field?","How does a compass work?"]),
   notes:""},
  {mode:"prac", timer:15, h:"Practical: test magnets and materials",
   html:`<div class="grid2 fill"><div class="box"><h3>Part A: materials</h3>${steps(["Touch each object with a magnet.","Record: attracted or not attracted.","Compare with your prediction."])}<h3>Part B: through materials</h3>${steps(["Put a paperclip under 1 sheet of paper. Can the magnet still move it?","Try 5 sheets, then cardboard, then your hand."])}</div>
   <div class="tablewrap"><table class="ctable"><thead><tr><th>Object</th><th>Material</th><th>Prediction</th><th>Result</th></tr></thead><tbody>${["Nail","Paperclip","Foil","Copper wire","Ruler","Spoon","Coin"].map(t=>`<tr><td>${t}</td><td></td><td></td><td></td></tr>`).join("")}</tbody></table></div></div>`,
   notes:"Practical sheet is the assessment. Keep magnets away from phones, laptops and bank cards."},
  {mode:"talk", timer:3, h:"What did we find?",
   html:`<div class="grid3">${[["Which materials were magnetic?","Iron and steel objects (and nickel). Other metals like aluminium and copper were not."],["Did the force work through paper?","Yes, but it got weaker as we added more layers (more distance)."],["Did the magnet need to touch the clip?","No. It pulled across a gap: a non-contact force."]].map(c=>rv(c[0],c[1])).join("")}</div>`,
   notes:""},
  {mode:"learn", h:"Magnets in real life",
   html:tabs([["MRI scanners",`<p class="lead">Huge magnets help doctors see inside the body without surgery.</p>`],["Maglev trains",`<p class="lead">Magnets lift the train above the track and push it along. No wheels touching means almost no friction, so it can go over 400 km/h.</p>`],["Recycling",`<p class="lead">Giant electromagnets pull steel cans out of mixed rubbish so they can be recycled.</p>`],["Compass",`<p class="lead">Earth acts like a giant magnet. A compass needle is a small magnet that lines up with Earth's magnetic field.</p>`],["At home",`<p class="lead">Fridge doors, cupboard catches, speakers, headphones and electric motors all use magnets.</p>`]]),
   notes:"Ask students to add one more example they can think of."},
  {mode:"check", h:"Exit ticket",
   html:`<div class="grid3">${[["N and S poles facing: attract or repel?","Attract."],["Name two magnetic materials.","Iron, steel, nickel, cobalt."],["Why is magnetism a non-contact force?","It acts across a gap without touching."]].map(c=>rv(c[0],c[1])).join("")}</div>${exitFist(["I can describe how magnets attract and repel.","I can identify which materials are magnetic.","I can give real-life uses of magnets."])}`,
   notes:""}
  ]},

{ n:18, title:"Electrostatic force",
  li:"Recognise electrostatic force as a non-contact force.",
  sc:["I can explain how objects become charged.","I can describe how charged objects attract and repel.","I can compare electrostatic and magnetic forces."],
  prep:"Balloons (one per pair), small pieces of tissue paper, a plastic comb, an empty aluminium drink can, a woollen jumper or cloth. Comparison chart.",
  slides:[
  {mode:"check", h:"Retrieval: magnets",
   html:`<div class="grid3">${[["Like poles...","Repel."],["Is aluminium magnetic?","No."],["Name a real-life use of magnets.","MRI, maglev trains, recycling, compass, fridge doors."]].map(c=>rv(c[0],c[1])).join("")}</div>`,
   notes:""},
  {mode:"prac", timer:10, h:"Static electricity challenges",
   html:`<div class="grid2 fill"><div class="box">${steps(["Rub a balloon on your hair or a jumper for 10 seconds.","Hold it near your hair. What happens?","Hold it over tiny bits of tissue paper.","Lay a drink can on its side. Can the balloon roll it without touching?","Rub two balloons. Hang them side by side. What happens?"])}</div><div class="box"><h3>Record</h3><p>For each challenge: did it <b>attract</b> or <b>repel</b>? Did the objects touch?</p><p class="small">Works best on a dry day. A humid room makes charges leak away.</p></div></div>`,
   notes:"Hands-on demo, pairs. The can race is a crowd pleaser."},
  {mode:"learn", h:"How objects become charged",
   html:`<div class="grid2 fill"><div style="display:flex;flex-direction:column;gap:1.2cqw"><div class="box"><h3>Tiny charges in everything</h3><p>All matter contains <b>positive</b> (+) and <b>negative</b> (&minus;) charges. Usually they are equal, so the object is <b>neutral</b>.</p></div><div class="box"><h3>Rubbing moves electrons</h3><p>Rubbing can move tiny negative particles called <b>electrons</b> from one object to another.</p></div></div>
   <div class="grid2">${[["Like charges","Repel. (+ and +, or &minus; and &minus;)","elec"],["Unlike charges","Attract. (+ and &minus;)","mag"]].map(c=>`<div class="fcard ${c[2]}"><h3 style="font-size:2.6cqw">${c[0]}</h3><p class="lead">${c[1]}</p></div>`).join("")}</div></div>
   <p class="def"><b>Electrostatic force</b> is a non-contact force between charged objects.</p>`,
   notes:"The same 'like repel, unlike attract' rule as magnets, which sets up the comparison chart."},
  {mode:"whole", h:"Balloon and hair", init:"charges",
   html:chargeUI,
   notes:"Click Rub a few times, narrating that electrons are moving. Then bring the balloon close."},
  {mode:"watch", h:"Bill Nye: static electricity",
   html:vid("oU8Fe6846d4","Bill Nye the Science Guy Performs a Static Electricity Science Demonstration","Sophia Learning",["What moves when you rub two objects together?","Why do some objects attract each other after rubbing?","Give one example of static electricity in nature."]),
   notes:"Lightning is the big natural example."},
  {mode:"write", timer:8, h:"Comparison chart: electrostatic vs magnetic", init:"cells",
   html:`<div class="tablewrap"><table class="ctable"><thead><tr><th></th><th><span class="fbadge elec">Electrostatic force</span></th><th><span class="fbadge mag">Magnetic force</span></th></tr></thead><tbody>${[["Contact or non-contact?","Non-contact","Non-contact"],["What causes it?","Charged objects (extra or missing electrons)","Magnets and magnetic materials"],["Attract?","Unlike charges (+ and &minus;)","Unlike poles (N and S)"],["Repel?","Like charges","Like poles"],["Which objects?","Almost any material once charged","Only iron, steel, nickel, cobalt"],["How long does it last?","Short time, charge leaks away","Permanent magnets last for years"]].map(r=>`<tr><td><b>${r[0]}</b></td><td class="rcell">${r[1]}</td><td class="rcell">${r[2]}</td></tr>`).join("")}</tbody></table></div><div class="row"><button class="btn" id="cellsAll">Reveal all</button><span class="small">Fill in your chart first, then click to check.</span></div>`,
   notes:"Comparison task is today's assessment. Ask: what are the two biggest similarities?"},
  {mode:"learn", h:"Electrostatic force in real life",

{ n:20, title:"Preparing for the parachute investigation",
  li:"Test a standard parachute as a class and plan how to change its design.",
  sc:["I can time drops carefully and explain why we repeat trials.","I can describe how design features might affect fall time.","I can make a prediction comparing a new design with the standard."],
  prep:"The class standard parachute (see the STD settings at the top of Week 6). Several stopwatches so a few students can time each drop. A 2 m drop mark.",
  slides:[
  {mode:"check", h:"Retrieval: air resistance",
   html:`<div class="grid3">${[["What two things increase air resistance?","Bigger surface area, faster speed."],["Why does a parachutist slow down when it opens?","Air resistance becomes bigger than weight: unbalanced upwards."],["What does 'fair test' mean?","Only one variable changes; everything else is kept the same."]].map(c=>rv(c[0],c[1])).join("")}</div>`,
   notes:""},
  {mode:"watch", h:"What makes a good parachute?",
   html:vid("a7SQjHi5LAE","What makes a good parachute? Physics, The Bloodhound Adventure","BBC Bitesize",["Which features of the parachute were tested?","How did they make it a fair test?","What design made the parachute fall slowest?"]),
   notes:""},
  {mode:"learn", h:"How our parachute investigation works",
   html:`<div class="grid3">${[["Step 1: today","Test the standard","The whole class tests the same standard parachute together. This gives us a result to compare everything against.","air"],["Step 2: Lessons 21 and 22","Design something different","Your group changes ONE thing about the standard, builds it and tests it.","push"],["Step 3: Lessons 23 and 24","Compare and report","Did your design fall slower or faster than the standard? Explain why using air resistance.","grav"]].map(c=>`<div class="fcard ${c[3]}"><span class="tag">${c[0]}</span><h3 style="font-size:2.4cqw">${c[1]}</h3><p>${c[2]}</p></div>`).join("")}</div>`,
   notes:"The standard parachute works like a control: every group's design is compared with it."},
  {mode:"learn", h:"Meet the standard parachute",
   html:`<div class="grid2 fill"><div class="simview">${CHUTE_SVG}</div><div class="box"><table class="ctable"><tbody>${STD_ROWS.map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td></tr>`).join("")}</tbody></table><p class="small">Copy these into your book. Every group's design starts from this one.</p></div></div>`,
   notes:"Sizes are set in the STD object at the top of Week 6. Any blank shows as a line: write the value on the board if it isn't filled in yet."},
  {mode:"learn", h:"Testing protocol",
   html:`<div class="grid2 fill"><div class="box">${steps(["Hold the canopy open at the 2 m mark.","Say '3, 2, 1, drop'. Timers start on 'drop'.","Stop the stopwatch when the load touches the floor.","Record the time to 2 decimal places.","If it hits something or drifts away, redo it."])}</div><div class="box"><h3>Biggest source of error</h3><p class="lead">Reaction time.</p><p>Humans take about 0.2 s to react. That's big when drops only last 2 to 3 seconds.</p><p class="small">Idea: film the drop on a phone and time it from the video.</p></div></div>`,
   notes:"Choose 3 or 4 student timers so the class can see how much their times differ for the same drop."},
  {mode:"prac", timer:15, h:"Class test: drop the standard parachute",
   html:`<div class="grid2 fill"><div class="box"><h3>Everyone records</h3><div class="tablewrap"><table class="ctable"><thead><tr><th>Drop</th><th>Time (s)</th></tr></thead><tbody>${[1,2,3,4,5].map(t=>`<tr><td>${t}</td><td></td></tr>`).join("")}<tr><td><b>Average</b></td><td></td></tr></tbody></table></div></div><div class="box"><h3>Watch for</h3><ul class="checklist"><li>Same height every drop</li><li>Canopy held open, not scrunched</li><li>Swinging, spinning or drifting</li><li>Did all the timers get the same time?</li></ul></div></div>`,
   notes:"Drop the standard 5 times. Use the agreed timer's results for the class average; keep the other timers' results to discuss reaction time."},
  {mode:"talk", timer:4, h:"What did we notice?",
   html:`<div class="grid3">${[["Was every drop the same time?","No. Small differences come from reaction time, the way it was dropped, and the canopy opening differently."],["Why do we repeat trials and average them?","One drop could be a fluke. An average of several drops is more reliable."],["Why is the standard result useful?","It is what every group compares their new design with."]].map(c=>rv(c[0],c[1],"Discuss, then click")).join("")}</div>`,
   notes:""},
  {mode:"learn", h:"How could you change the standard?",
   html:tabs([
     ["Canopy size",`<p class="lead">A bigger canopy has more surface area, so more air resistance.</p><p>Prediction: bigger canopy, longer fall time.</p>`],
     ["Material",`<p class="lead">Light, air-tight materials (plastic bag) work well. Heavy fabric adds weight. Porous tissue lets air through.</p>`],
     ["String length",`<p class="lead">Short strings pull the canopy into a small shape. Longer strings let it open fully, but the effect is smaller than you might think.</p>`],
     ["Load mass",`<p class="lead">A heavier load (more paper clips or washers) has more weight, so the parachute falls faster.</p>`],
     ["Shape",`<p class="lead">A circle, hexagon or a canopy with a small hole in the middle may fall differently. A vent hole can stop the parachute swinging.</p>`]]),
   notes:"Each group's design changes ONE of these from the standard."},
  {mode:"talk", timer:4, h:"Fair or unfair?", init:"vote",
   data:[["Group A makes the canopy bigger AND adds 3 more paper clips than the standard.","Unfair. They changed two things. You can't tell which one made the difference."],["Group B makes the canopy bigger. Everything else is the same as the standard.","Fair. Only one thing is different from the standard."],["Group C drops the standard from 2 m but drops their design from a table.","Unfair. Drop height must be the same."],["Group D times their design once.","Fair, but not reliable. They need repeat trials, like we did with the standard."]],
   html:`<p>Thumbs up = fair test. Thumbs down = unfair. Explain why.</p>${voteUI()}`,
   notes:"Group D is about reliability, not fairness. Good discussion point."},
  {mode:"write", timer:8, h:"Design ideas and prediction",
   html:`<div class="grid2 fill"><div class="box"><h3>In your book</h3>${steps(["Which ONE feature will your group change from the standard?","How will you change it?","What will you keep the same as the standard? List at least 4 things.","Predict: will your design fall slower or faster than the standard? Give a reason using air resistance."])}</div>
   <div class="box"><h3>Bring next lesson</h3><ul><li>Plastic shopping bags (clean)</li><li>Any light fabric scraps</li></ul><p class="small">We'll provide string, tape, paper clips and stopwatches.</p></div></div>`,
   notes:"Design ideas and prediction are today's evidence. Approve each group's one change before Lesson 21."},
  {mode:"check", h:"Exit ticket",
   html:`<div class="box fill" style="justify-content:center"><p class="lead">Complete:</p><p class="def">"I think our design will fall ___ than the standard because it will have more / less ___, which pushes up against ___."</p></div>`,
   notes:""}
  ]}
);
/* ---------- Week 6: Practical 2, parachute investigation ---------- */
/* Example class data: the standard parachute compared with four group designs (made-up example results). */
const CHUTE_DATA=[["Standard",[2.41,2.55,2.47],2.48],["Bigger canopy",[3.21,3.35,3.28],3.28],["Tissue canopy",[1.92,2.05,1.98],1.98],["Longer strings",[2.52,2.61,2.49],2.54],["Extra load",[1.71,2.38,1.76],1.74]];
const CHUTE_REPORT=[["Aim","What are you trying to find out?","To compare how long a parachute with a bigger canopy takes to fall 2 m with the class standard parachute."],
  ["Hypothesis","If... then... because...","If we make the canopy bigger than the standard, then our parachute will take longer to fall, because a bigger surface area creates more air resistance pushing up against gravity."],
  ["Variables","IV, DV and controlled variables.","IV: parachute design (standard canopy or bigger canopy). DV: fall time (s). CV: drop height (2 m), canopy material, string length, number of paper clips, same person timing, no wind."],
  ["Method","Numbered steps with a labelled diagram.","1. Use the class standard parachute. 2. Make a copy with a bigger canopy, using the same material, string length and load. 3. Hold each canopy open at 2 m. 4. Drop and start the stopwatch at the same time. 5. Stop when it touches the floor. 6. Repeat 3 times for each parachute."],
  ["Results","Table with units and averages, plus a column graph.","Table: Parachute | Trial 1 (s) | Trial 2 (s) | Trial 3 (s) | Average (s). Column graph of the average fall time for the standard and for our design."],
  ["Conclusion","Pattern, data, science, hypothesis.","Our bigger canopy took 3.28 s on average, compared with 2.48 s for the standard. That is 0.80 s longer. A bigger canopy has more surface area, so more air resistance pushes up against gravity and it falls more slowly. This supports my hypothesis."],
  ["Evaluation","Fair test? Reliable? Specific improvement.","Only the canopy size was different from the standard, so it was a fair test. Our trials were close together (within 0.14 s), so the results were fairly reliable. Reaction time when starting and stopping the stopwatch was the biggest error. To improve, film each drop on a phone and time it from the video."]];

/* ---------- timer ---------- */
let T={left:0,run:false,id:null,el:null};
function timerHTML(min){return `<div class="timer" id="timer" data-min="${min}"><span class="t" id="tDisp">${fmt(min*60)}</span><button id="tGo">Start</button><button id="tAdd" aria-label="Add one minute">+1</button><button id="tReset">Reset</button></div>`}
function fmt(s){return `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`}
function bindTimer(){
  clearInterval(T.id);T={left:0,run:false,id:null,el:$("#timer")};if(!T.el)return;
  T.left=+T.el.dataset.min*60;
  const paint=()=>{$("#tDisp").textContent=fmt(T.left);$("#tGo").textContent=T.run?"Pause":"Start";T.el.classList.toggle("done",T.left===0)};
  const tick=()=>{if(T.left>0){T.left--;if(T.left===0){T.run=false;clearInterval(T.id);chime()}}paint()};
  T.toggle=()=>{if(T.left===0)return;T.run=!T.run;clearInterval(T.id);if(T.run)T.id=setInterval(tick,1000);paint()};
  $("#tGo").onclick=T.toggle;$("#tAdd").onclick=()=>{T.left+=60;paint()};
  $("#tReset").onclick=()=>{clearInterval(T.id);T.run=false;T.left=+T.el.dataset.min*60;paint()};paint();
}
function chime(){try{const a=new (window.AudioContext||window.webkitAudioContext)();[0,.25,.5].forEach(d=>{const o=a.createOscillator(),g=a.createGain();o.frequency.value=880;o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(.18,a.currentTime+d);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d+.22);o.start(a.currentTime+d);o.stop(a.currentTime+d+.25)})}catch(e){}}

/* ---------- rendering ---------- */
const WEEKS=["Introduction to forces","Gravity, friction and air resistance","Practical 1: mass and stopping distance","Force diagrams and motion","Non-contact forces and changing motion","Practical 2: parachute investigation","Consolidation and assessment"];
const wk=l=>Math.ceil(LESSONS[l].n/4);
let L=-1,S=0;
const RELIEF=/[?&]relief\b/.test(location.search);
const useRelief=l=>RELIEF&&!!LESSONS[l].relief;
function deck(l){return [{title:true},...(useRelief(l)?LESSONS[l].relief:LESSONS[l].slides)]}
function drawNav(){
  const w=L<0?0:wk(L), nav=$("#lessonNav");
  nav.innerHTML=WEEKS.map((t,i)=>`<button class="wk" data-w="${i+1}" title="Week ${i+1}: ${t}" aria-current="${w===i+1}">Wk ${i+1}</button>`).join("")
    +(w?`<span class="wkSep"></span>`+LESSONS.map((x,i)=>wk(i)===w?`<button data-l="${i}" aria-current="${i===L}">Lesson ${x.n}</button>`:"").join(""):"");
  nav.querySelectorAll("[data-w]").forEach(b=>b.onclick=()=>go(LESSONS.findIndex((x,i)=>wk(i)===+b.dataset.w),0));
  nav.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>go(+b.dataset.l,0));
}

  const stage=$("#stage"); clearInterval(T.id); stopAnim(); drawNav();
  if(L<0){
    stage.innerHTML=`<div class="home"><div><p class="small" style="font-family:var(--f-mono);color:var(--accent);font-weight:700">YEAR 7 SCIENCE &middot; PHYSICS &middot; 7 WEEKS &middot; 28 LESSONS</p><h1 style="font-size:4cqw">Forces and Motion</h1><p class="lead" style="font-size:1.6cqw;max-width:70ch;margin-top:.6cqw">Pushes, pulls, gravity, friction and air resistance, with two full practical investigations. Every lesson mixes talk, movement, demos, videos, simulations and short writing tasks.</p></div>
    <div class="wkList">${WEEKS.map((t,w)=>`<div class="wkCol"><div title="${t}" style="display:flex;align-items:center"><h3>Week ${w+1}</h3></div>${LESSONS.map((x,i)=>wk(i)===w+1?`<button class="lc" data-go="${i}"><i>${x.n}</i><span>${x.title}</span></button>`:"").join("")}</div>`).join("")}</div></div>`;
    stage.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(+b.dataset.go,0));
    $("#count").textContent="";$("#progBar").style.width="0";$("#ctrl").style.visibility="hidden";$("#notes").hidden=true;$("#notesBtn").setAttribute("aria-pressed","false");save();return;
  }
  $("#ctrl").style.visibility="visible";
  const x=LESSONS[L],d=deck(L),s=d[S];
  if(s.title){
    const rv2=useRelief(L), sw=x.relief?`<a class="reliefSw" href="${rv2?location.pathname:location.pathname+"?relief"}#l${x.n}-1">${rv2?"Switch to the full lesson":"Switch to the relief version"}</a>`:"";
    stage.innerHTML=`<section class="slide title">${sw}<span class="num">LESSON ${x.n} OF 28 &middot; WEEK ${wk(L)}${rv2?' &middot; <span class="reliefTag">RELIEF VERSION</span>':""}</span><h1>${x.title}</h1><div class="lisc"><div class="box"><h3>Learning intention</h3><p>${x.li}</p></div><div class="box"><h3>Success criteria</h3><ul>${x.sc.map(c=>`<li>${c}</li>`).join("")}</ul></div></div></section>`;
  } else {

    stage.innerHTML=`<section class="slide${s.timer?" hasTimer":""}"><div class="eyebrow"><span class="mode" style="--mc:${m[1]}">${m[0]}</span><span>Lesson ${x.n}</span>${s.timer?`<span>&middot; ${s.timer} min</span>`:""}</div><h2>${s.h}</h2>${s.html}${s.timer?timerHTML(s.timer):""}</section>`;
  }
  stage.querySelectorAll("[data-reveal]").forEach(b=>b.onclick=()=>b.classList.toggle("open"));
  stage.querySelectorAll(".tabbar").forEach(bar=>{const box=bar.parentElement;bar.querySelectorAll("[data-tab]").forEach(t=>t.onclick=()=>{bar.querySelectorAll("[data-tab]").forEach(o=>o.setAttribute("aria-selected",o===t));box.querySelectorAll("[data-panel]").forEach(p=>p.classList.toggle("on",p.dataset.panel===t.dataset.tab))})});
  if(s.init)s.init.split(" ").forEach(k=>INIT[k]&&INIT[k](s));
  bindTimer();

  $("#prev").disabled=S===0&&L===0;

  save();
}
function go(l,s){L=l;S=s;render();try{history.replaceState(null,"",L<0?"#home":`#l${LESSONS[L].n}-${S+1}`)}catch(e){}}
function next(){if(L<0)return go(0,0);const d=deck(L);if(S<d.length-1)go(L,S+1);else if(L<LESSONS.length-1)go(L+1,0)}
function prev(){if(L<0)return;if(S>0)go(L,S-1);else if(L>0)go(L-1,deck(L-1).length-1)}
function save(){try{localStorage.setItem("fm-pos",JSON.stringify([L,S]))}catch(e){}}

$("#homeBtn").onclick=()=>go(-1,0);$("#next").onclick=next;$("#prev").onclick=prev;
$("#notesBtn").onclick=()=>{const n=$("#notes");n.hidden=!n.hidden;$("#notesBtn").setAttribute("aria-pressed",!n.hidden)};
$("#fsBtn").onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{})}catch(e){}};
document.addEventListener("keydown",e=>{if(e.target.matches("input,textarea"))return;
  if(e.key==="ArrowRight"||e.key==="PageDown"){e.preventDefault();next()}
  else if(e.key==="ArrowLeft"||e.key==="PageUp"){e.preventDefault();prev()}
  else if(e.key==="n"||e.key==="N")$("#notesBtn").click();
  else if(e.key==="t"||e.key==="T"){if(T.toggle)T.toggle()}
  else if(e.key==="f"||e.key==="F")$("#fsBtn").click()});

(function start(){
  const h=location.hash.match(/^#l(\d+)-(\d+)$/);
  if(h){const l=LESSONS.findIndex(x=>x.n===+h[1]),s=+h[2]-1;if(l>=0&&s<deck(l).length)return go(l,s)}
  let p=null;try{p=JSON.parse(localStorage.getItem("fm-pos"))}catch(e){}
  if(Array.isArray(p)&&p[0]>=0&&LESSONS[p[0]]&&p[1]<deck(p[0]).length)return go(p[0],p[1]);
  go(-1,0);
})();
