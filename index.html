<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Forces and Motion Lessons</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: projector-first 16:9 stage under a slim lesson bar; each force type keeps one colour everywhere */
:root{
  --bg:#e9efed; --surface:#fbfdfc; --ink:#13221e; --muted:#566862; --line:#cad7d2;
  --air:#2f73bb; --push:#0f7f80; --fric:#b0512a; --grav:#6a4bb3; --mag:#b8326a; --elec:#9a6b00;
  --accent:#b0512a; --accent-ink:#ffffff; --good:#2f7d3a; --bad:#b3372f;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1614; --surface:#15201e; --ink:#e4eeea; --muted:#9db1aa; --line:#2b3c38;
  --air:#7db2ea; --push:#4fc4c1; --fric:#e9895a; --grav:#b8a2f2; --mag:#f08cb3; --elec:#e8c25a;
  --accent:#e9895a; --accent-ink:#1a0e08; --good:#7fcf86; --bad:#f08a80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1614; --surface:#15201e; --ink:#e4eeea; --muted:#9db1aa; --line:#2b3c38;
  --air:#7db2ea; --push:#4fc4c1; --fric:#e9895a; --grav:#b8a2f2; --mag:#f08cb3; --elec:#e8c25a;
  --accent:#e9895a; --accent-ink:#1a0e08; --good:#7fcf86; --bad:#f08a80; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{display:flex;flex-direction:column;height:100%;padding-inline:16px}

/* top bar */
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px}
.brand{font-family:var(--f-display);font-weight:800;font-size:18px;letter-spacing:-.01em;background:none;border:0;padding:0;display:flex;align-items:center;gap:8px}
.brand .dots{display:inline-flex;gap:3px}
.brand .dots i{width:9px;height:9px;border-radius:50%;display:block}
.lessons{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.lessons button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:14px}
.lessons button[aria-current="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* stage */
.stageWrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.stage{width:min(100%, calc((100dvh - 130px) * 16 / 9));aspect-ratio:16/9;max-width:100%;container-type:inline-size;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;position:relative;overflow:hidden}
.slide{position:absolute;inset:0;padding:3.2cqw 4cqw 3cqw;display:flex;flex-direction:column;gap:1.4cqw;overflow:auto;font-size:1.85cqw}
.eyebrow{display:flex;align-items:center;gap:1cqw;font-size:1.25cqw;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.mode{display:inline-flex;align-items:center;gap:.6cqw;padding:.35cqw 1cqw;border-radius:999px;background:var(--ink);color:var(--bg);letter-spacing:.06em}
.mode::before{content:"";width:.8cqw;height:.8cqw;border-radius:50%;background:var(--mc,var(--accent))}
.slide h2{font-family:var(--f-display);font-weight:800;font-size:3.5cqw;line-height:1.05;letter-spacing:-.02em;margin:0;text-wrap:balance}
.slide h3{font-family:var(--f-display);font-weight:600;font-size:2.1cqw;margin:0;line-height:1.15}
.slide p{margin:0;max-width:62ch}
.slide ul,.slide ol{margin:0;padding-left:1.4em;display:grid;gap:.5cqw}
.lead{font-size:2.3cqw;line-height:1.3}
.small{font-size:1.4cqw;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:2cqw}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:1.6cqw}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:1.4cqw}
.grid2>*,.grid3>*,.grid4>*{min-width:0}
.box{border:1px solid var(--line);border-radius:1cqw;padding:1.4cqw 1.6cqw;display:flex;flex-direction:column;gap:.7cqw}
.steps{counter-reset:s;list-style:none;padding:0 !important}
.steps li{counter-increment:s;display:grid;grid-template-columns:3cqw 1fr;gap:1cqw;align-items:start}
.steps li::before{content:counter(s);font-family:var(--f-display);font-weight:800;width:2.6cqw;height:2.6cqw;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:1.5cqw}
.key{font-weight:700;color:var(--accent)}
.def{border-left:.5cqw solid var(--accent);padding:.6cqw 0 .6cqw 1.4cqw;font-size:2.2cqw;line-height:1.3;max-width:56ch}
.chip{display:inline-block;padding:.2cqw .9cqw;border-radius:999px;font-weight:700;font-size:.9em}
.air{--sc:var(--air)} .push{--sc:var(--push)} .fric{--sc:var(--fric)} .grav{--sc:var(--grav)} .mag{--sc:var(--mag)} .elec{--sc:var(--elec)}
.tint{background:color-mix(in srgb,var(--sc) 13%,var(--surface));border-color:color-mix(in srgb,var(--sc) 45%,var(--line))}
.ink{color:var(--sc)}
.chip.air,.chip.push,.chip.fric,.chip.grav,.chip.mag,.chip.elec{background:var(--sc);color:var(--surface)}
.fill{flex:1;min-height:0}
.row{display:flex;gap:1cqw;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:.8cqw;padding:.6cqw 1.3cqw;font-size:1.45cqw;font-weight:700}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* title slide */
.title{justify-content:center;gap:2cqw;background:
  radial-gradient(circle at 92% 18%, color-mix(in srgb,var(--air) 22%,transparent) 0 9cqw, transparent 9.1cqw),
  radial-gradient(circle at 84% 70%, color-mix(in srgb,var(--push) 20%,transparent) 0 11cqw, transparent 11.1cqw),
  radial-gradient(circle at 70% 32%, color-mix(in srgb,var(--grav) 18%,transparent) 0 7cqw, transparent 7.1cqw),
  radial-gradient(circle at 98% 92%, color-mix(in srgb,var(--fric) 20%,transparent) 0 8cqw, transparent 8.1cqw)}
.title .num{font-family:var(--f-mono);font-weight:700;font-size:1.5cqw;color:var(--accent);letter-spacing:.04em}
.title h1{font-family:var(--f-display);font-weight:800;font-size:6cqw;line-height:.98;letter-spacing:-.03em;margin:0;max-width:16ch;text-wrap:balance}
.lisc{display:grid;grid-template-columns:1fr 1fr;gap:2cqw;max-width:72cqw}
.lisc .box{background:var(--surface)}
.lisc h3{font-size:1.4cqw;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-family:var(--f-body);font-weight:700}

/* reveal cards */
.reveal{border:1px dashed var(--line);border-radius:1cqw;padding:1.2cqw 1.4cqw;background:var(--surface);text-align:left;display:flex;flex-direction:column;gap:.5cqw;min-height:7cqw}
.reveal .q{font-weight:700}
.reveal .a{display:none;color:var(--ink)}
.reveal .hint{font-size:1.2cqw;color:var(--muted)}
.reveal.open{border-style:solid;border-color:var(--accent)}
.reveal.open .a{display:block}
.reveal.open .hint{display:none}

/* tabs */
.tabbar{display:flex;gap:.6cqw;flex-wrap:wrap}
.tabbar button{border:1px solid var(--line);background:var(--surface);border-radius:.8cqw;padding:.5cqw 1.1cqw;font-size:1.45cqw;font-weight:700}
.tabbar button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.panel{display:none}.panel.on{display:flex}

/* video */
.vid{aspect-ratio:16/9;width:100%;border-radius:1cqw;overflow:hidden;background:#000;border:1px solid var(--line)}
.vid iframe{width:100%;height:100%;border:0;display:block}
.vidlink{aspect-ratio:16/9;width:100%;border-radius:1cqw;border:1px solid var(--line);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:1cqw;text-decoration:none;color:var(--ink);
  background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--push) 10%,var(--surface)) 0 1.2cqw,var(--surface) 1.2cqw 2.4cqw)}
.vidlink .play{width:7cqw;height:7cqw;border-radius:50%;background:var(--bad);display:grid;place-items:center}
.vidlink .play::after{content:"";border-left:2.4cqw solid #fff;border-top:1.5cqw solid transparent;border-bottom:1.5cqw solid transparent;margin-left:.6cqw}
.vidlink b{font-family:var(--f-display);font-size:2cqw;text-align:center;padding-inline:2cqw}
.vidlink span{font-size:1.3cqw;color:var(--muted)}
.vgrid{display:grid;grid-template-columns:1.55fr 1fr;gap:2cqw;align-items:start}
.vgrid>*{min-width:0}

/* timer */
.timer{position:absolute;right:2.2cqw;bottom:2cqw;display:flex;align-items:center;gap:.6cqw;background:var(--ink);color:var(--bg);border-radius:1.2cqw;padding:.6cqw .8cqw .6cqw 1.3cqw;z-index:2}
.timer .t{font-family:var(--f-mono);font-weight:700;font-size:2.6cqw;font-variant-numeric:tabular-nums;min-width:8.5ch;text-align:center}
.timer button{background:transparent;border:1px solid color-mix(in srgb,var(--bg) 40%,transparent);color:var(--bg);border-radius:.6cqw;padding:.3cqw .8cqw;font-size:1.25cqw;font-weight:700}
.timer.done{background:var(--bad)}
.timer.done .t{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}
.hasTimer{padding-bottom:8cqw}

/* sorter */
.sortItems{display:flex;flex-wrap:wrap;gap:.7cqw;min-height:4cqw;padding:1cqw;border:1px dashed var(--line);border-radius:1cqw}
.card{border:1px solid var(--line);background:var(--surface);border-radius:.7cqw;padding:.45cqw 1cqw;font-size:1.5cqw;font-weight:700;touch-action:none;user-select:none}
.card.sel{outline:3px solid var(--accent)}
.card.ok{border-color:var(--good);box-shadow:inset 0 0 0 2px var(--good)}
.card.no{border-color:var(--bad);box-shadow:inset 0 0 0 2px var(--bad)}
.zones{display:grid;grid-template-columns:repeat(4,1fr);gap:1cqw;flex:1;min-height:0}
.zone{border:2px solid;border-radius:1cqw;padding:1cqw;display:flex;flex-direction:column;gap:.6cqw;align-content:flex-start;min-height:12cqw;text-align:left;background:color-mix(in srgb,var(--sc) 9%,var(--surface));border-color:color-mix(in srgb,var(--sc) 55%,var(--line))}
.zone h3{color:var(--sc)}
.zone .drop{display:flex;flex-wrap:wrap;gap:.5cqw}
.zone.over{background:color-mix(in srgb,var(--sc) 22%,var(--surface))}

/* big spotlight */
.spot{font-family:var(--f-display);font-weight:800;font-size:6cqw;line-height:1;letter-spacing:-.02em;text-align:center;padding:2cqw}
.corners{display:grid;grid-template-columns:1fr 1fr;gap:1cqw}
.corner{border-radius:1cqw;padding:1cqw 1.4cqw;font-weight:700;color:var(--surface);background:var(--sc);font-size:1.7cqw}
.corner.dim{opacity:.25}

/* matrix */
.matrix{display:grid;grid-template-columns:auto repeat(4,1fr);gap:.5cqw;font-size:1.4cqw}
.matrix .h{font-weight:700;padding:.5cqw;display:flex;align-items:center;justify-content:center;text-align:center;border-radius:.6cqw;color:var(--surface);background:var(--sc)}
.matrix button{border:1px solid var(--line);background:var(--surface);border-radius:.6cqw;padding:.7cqw;font-size:1.3cqw;min-height:4.4cqw}
.matrix button.seen{background:color-mix(in srgb,var(--accent) 14%,var(--surface));border-color:var(--accent)}
.matrix button.self{opacity:.55}
.mout{border:1px solid var(--accent);border-radius:1cqw;padding:1.2cqw 1.4cqw;min-height:9cqw}

/* timeline ordering */
.ordered{display:flex;flex-direction:column;gap:.5cqw;counter-reset:o;list-style:none;padding:0 !important}
.ordered li{counter-increment:o;display:flex;gap:1cqw;align-items:center;border:1px solid var(--line);border-radius:.7cqw;padding:.45cqw 1cqw;font-weight:700;font-size:1.5cqw}
.ordered li::before{content:counter(o);font-family:var(--f-mono);color:var(--muted);width:2.4cqw}
.ordered li small{font-weight:400;color:var(--muted);margin-left:auto;font-size:1.25cqw}
.ordered li.ok{border-color:var(--good);box-shadow:inset 0 0 0 2px var(--good)}
.ordered li.no{border-color:var(--bad);box-shadow:inset 0 0 0 2px var(--bad)}
.scale{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:1.15cqw;color:var(--muted);border-top:2px solid var(--muted);padding-top:.4cqw}

svg text{font-family:var(--f-body)}
.cm-edge{transition:opacity .4s}
@media (prefers-reduced-motion:reduce){.cm-edge{transition:none}.timer.done .t{animation:none}}

/* footer controls */
.ctrl{display:flex;align-items:center;gap:8px;padding-block:10px;flex-wrap:wrap}
.ctrl button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 14px;font-weight:700;font-size:14px}
.ctrl .count{font-family:var(--f-mono);font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.prog{flex:1;min-width:80px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);width:0}
.hint{font-size:12px;color:var(--muted)}

/* notes drawer */
.notes{position:fixed;right:16px;bottom:64px;width:min(420px,calc(100% - 32px));max-height:55%;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:0 10px 30px rgba(0,0,0,.18);z-index:10;font-size:15px}
.notes h4{margin:0 0 6px;font-family:var(--f-display);font-size:16px}
.notes p{margin:0 0 6px}

/* home */
.home{position:absolute;inset:0;overflow:auto;padding:3cqw 4cqw;display:flex;flex-direction:column;gap:1.6cqw;font-size:1.7cqw}
.home h1{font-family:var(--f-display);font-weight:800;font-size:5cqw;margin:0;letter-spacing:-.03em;line-height:1}
.lcards{display:grid;grid-template-columns:repeat(4,1fr);gap:1.4cqw}
.lcard{border:1px solid var(--line);background:var(--surface);border-radius:1.2cqw;padding:1.6cqw;text-align:left;display:flex;flex-direction:column;gap:.8cqw;min-width:0}
.lcard:hover{border-color:var(--accent)}
.lcard .n{font-family:var(--f-mono);color:var(--accent);font-weight:700;font-size:1.3cqw}
.lcard b{font-family:var(--f-display);font-size:2.2cqw;line-height:1.05}
.lcard span{font-size:1.35cqw;color:var(--muted)}
.weeks{display:flex;gap:.8cqw;flex-wrap:wrap}
.weeks span{border:1px dashed var(--line);border-radius:999px;padding:.4cqw 1.2cqw;font-size:1.3cqw;color:var(--muted)}

/* narrow screens: let slides grow tall instead of shrinking type */
@media (max-width:760px){
  .stage{aspect-ratio:auto;width:100%;height:auto;min-height:60vh}
  .stageWrap{align-items:stretch}
  .slide,.home{position:relative;inset:auto;font-size:16px;padding:20px 18px}
  .slide h2{font-size:26px}.slide h3{font-size:19px}.title h1,.home h1{font-size:34px}
  .lead,.def{font-size:18px}.small,.eyebrow,.hint,.reveal .hint{font-size:13px}
  .grid2,.grid3,.grid4,.vgrid,.zones,.lisc,.lcards,.corners{grid-template-columns:1fr}
  .btn,.tabbar button,.card,.ordered li,.matrix,.matrix button,.lcard span,.lcard .n{font-size:14px}
  .lcard b{font-size:20px}.timer .t{font-size:22px}.timer button{font-size:13px}
  .timer{position:sticky;bottom:8px;align-self:flex-end}
  .spot{font-size:34px}.corner{font-size:15px}.mode::before{width:8px;height:8px}
  .steps li{grid-template-columns:28px 1fr}.steps li::before{width:24px;height:24px;font-size:13px}
  .vidlink .play{width:56px;height:56px}.vidlink b{font-size:17px}.vidlink span{font-size:13px}
  .vidlink .play::after{border-left-width:18px;border-top-width:11px;border-bottom-width:11px}
}

/* ---- additions for weeks 2 to 7 ---- */
.wkSep{width:1px;height:22px;background:var(--line);margin-inline:4px}
.lessons button.wk{font-family:var(--f-mono);font-size:13px}
.slot{cursor:pointer}
.slot rect{fill:var(--surface);stroke:var(--accent);stroke-width:2;stroke-dasharray:5 4}
.slot text{font-size:14px;font-weight:700;fill:var(--ink);font-family:var(--f-body)}
.slot.ok rect{stroke:var(--good);stroke-dasharray:none;stroke-width:3}
.slot.no rect{stroke:var(--bad);stroke-dasharray:none;stroke-width:3}
.slot:focus-visible rect{stroke-width:4}
.blank{display:inline-block;min-width:7em;border:0;border-bottom:3px dashed var(--accent);background:transparent;text-align:center;font-weight:700;padding:0 .3em;font-size:inherit}
.blank.ok{border-bottom-style:solid;border-color:var(--good)}
.blank.no{border-bottom-style:solid;border-color:var(--bad)}
.bank{display:flex;flex-wrap:wrap;gap:.6cqw}
.bank .card.used{opacity:.45}
.eqn{font-size:2.3cqw;line-height:2.2;font-family:var(--f-display)}
.ctable{border-collapse:collapse;width:100%;font-size:1.45cqw}
.ctable th,.ctable td{border:1px solid var(--line);padding:.6cqw .8cqw;text-align:left;vertical-align:top}
.ctable th{background:color-mix(in srgb,var(--ink) 6%,var(--surface))}
.ctable td.rcell{cursor:pointer;color:transparent;background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--accent) 8%,var(--surface)) 0 .6cqw,var(--surface) .6cqw 1.2cqw)}
.ctable td.rcell.open{color:var(--ink);background:var(--surface)}
.tablewrap{overflow-x:auto;max-width:100%}
.die{width:9cqw;height:9cqw;border-radius:1.4cqw;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-family:var(--f-mono);font-size:5cqw;font-weight:700}
.stations{display:grid;grid-template-columns:repeat(4,1fr);gap:.6cqw}
.stations button{border:1px solid var(--line);background:var(--surface);border-radius:.7cqw;padding:.6cqw;font-weight:700;font-size:1.4cqw}
.stations button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.journey{display:flex;flex-wrap:wrap;gap:.4cqw;align-items:center;font-size:1.3cqw}
.journey span{border:1px solid var(--line);border-radius:999px;padding:.2cqw .8cqw}
.teams{display:grid;grid-template-columns:repeat(4,1fr);gap:.8cqw}
.team{border:1px solid var(--line);border-radius:1cqw;padding:.8cqw;display:flex;flex-direction:column;align-items:center;gap:.4cqw}
.team b{font-family:var(--f-mono);font-size:3cqw;font-variant-numeric:tabular-nums}
.team .row{justify-content:center}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:.8cqw}
.opts div{border:1px solid var(--line);border-radius:.8cqw;padding:.8cqw 1.1cqw}
.opts div.right{border-color:var(--good);box-shadow:inset 0 0 0 2px var(--good)}
.chartbox svg{width:100%;height:auto;display:block}
.chartbox text{font-size:12px;fill:var(--muted)}
.wkList{display:grid;grid-template-columns:1fr;gap:.7cqw}
.wkCol{display:grid;grid-template-columns:9cqw repeat(4,1fr);gap:.6cqw;align-items:stretch;min-width:0}
.wkCol>div{min-width:0}
.wkCol h3{font-family:var(--f-display);font-size:1.7cqw;margin:0}
.wkCol .lc{border:1px solid var(--line);background:var(--surface);border-radius:.8cqw;padding:.5cqw .8cqw;text-align:left;font-size:1.2cqw;display:flex;gap:.7cqw;align-items:baseline;min-width:0}
.wkCol .lc:hover{border-color:var(--accent)}
.wkCol .lc i{font-style:normal;font-family:var(--f-mono);color:var(--accent);font-weight:700;min-width:2.2em}
@media (max-width:760px){
  .eqn{font-size:18px}.ctable{font-size:13px}.die{width:64px;height:64px;font-size:34px}
  .stations,.teams,.opts{grid-template-columns:1fr 1fr}.wkCol{grid-template-columns:1fr}
  .stations button,.journey,.wkCol .lc{font-size:14px}.team b{font-size:22px}.wkCol h3{font-size:17px}
}

/* ---- Forces and Motion additions ---- */
.chip{color:var(--surface);background:var(--sc,var(--ink))}
.fbadge{display:inline-flex;align-items:center;gap:.5cqw;font-weight:700;color:var(--sc)}
.fbadge::before{content:"";width:1.1cqw;height:1.1cqw;border-radius:50%;background:var(--sc)}
.fcard{border:2px solid color-mix(in srgb,var(--sc) 55%,var(--line));background:color-mix(in srgb,var(--sc) 9%,var(--surface));border-radius:1cqw;padding:1.2cqw 1.4cqw;display:flex;flex-direction:column;gap:.5cqw;min-width:0}
.fcard h3{color:var(--sc)}
.fcard .tag{font-size:1.15cqw;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--muted)}
.sim{display:grid;grid-template-columns:1.55fr 1fr;gap:1.6cqw;flex:1;min-height:0}
.sim>*{min-width:0}
.simview{border:1px solid var(--line);border-radius:1cqw;overflow:hidden;background:color-mix(in srgb,var(--air) 7%,var(--surface));display:flex;align-items:center;justify-content:center}
.simview{min-height:0;height:100%}
.simview svg{width:100%;height:100%;max-height:100%;display:block}
.simctl{display:flex;flex-direction:column;gap:.9cqw;font-size:1.5cqw}
.simctl label{display:flex;flex-direction:column;gap:.3cqw;font-weight:700}
.simctl label span.v{font-family:var(--f-mono);color:var(--accent)}
.simctl select{font:inherit;font-size:1.45cqw;padding:.4cqw .6cqw;border-radius:.6cqw;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--accent)}
.readout{font-family:var(--f-mono);font-weight:700;font-size:2.6cqw;font-variant-numeric:tabular-nums;color:var(--ink)}
.readout small{font-size:1.2cqw;color:var(--muted);font-family:var(--f-body);font-weight:400;display:block}
.mini{border-collapse:collapse;width:100%;font-size:1.3cqw;font-variant-numeric:tabular-nums}
.mini th,.mini td{border:1px solid var(--line);padding:.35cqw .6cqw;text-align:center}
.mini th{background:color-mix(in srgb,var(--ink) 6%,var(--surface))}
.mini td:first-child,.mini th:first-child{text-align:left}
.fpick{display:flex;flex-wrap:wrap;gap:.5cqw}
.fpick button{border:1px solid var(--line);background:var(--surface);border-radius:.7cqw;padding:.45cqw .9cqw;font-size:1.35cqw;font-weight:700}
.fpick button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.verdict{border:1px solid var(--accent);border-radius:1cqw;padding:1cqw 1.3cqw;min-height:6cqw}
.verdict[hidden]{display:none}
.arrowlab{font-size:14px;font-weight:700;font-family:var(--f-body);paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}
.compare{display:grid;grid-template-columns:1fr auto 1fr;gap:1.4cqw;align-items:center}
.vs{font-family:var(--f-display);font-weight:800;font-size:3cqw;color:var(--muted)}
.checklist{list-style:none;padding:0 !important;display:grid;gap:.6cqw}
.checklist li{display:flex;gap:1cqw;align-items:flex-start}
.checklist li::before{content:"";flex:none;width:1.8cqw;height:1.8cqw;border:2px solid var(--accent);border-radius:.4cqw;margin-top:.2cqw}
.starter{font-style:italic;color:var(--muted)}
.ph{border:1px dashed var(--line);border-radius:1cqw;display:grid;place-items:center;color:var(--muted);text-align:center;padding:2cqw}
.vid.sim-embed{aspect-ratio:auto;height:100%;min-height:24cqw;background:var(--surface)}
@media (max-width:760px){
  .sim,.compare{grid-template-columns:1fr}
  .simview{height:auto;min-height:240px}.simview svg{height:auto;max-height:70vh}
  .simctl,.simctl select,.fpick button,.mini{font-size:14px}
  .readout{font-size:22px}.readout small,.fcard .tag{font-size:12px}
  .vs{font-size:22px}.checklist li::before{width:16px;height:16px}
  .fbadge::before{width:10px;height:10px}
}

<body>
<div class="app">
  <header class="bar">
    <button class="brand" id="homeBtn" aria-label="Unit home"><span class="dots"><i style="background:var(--push)"></i><i style="background:var(--fric)"></i><i style="background:var(--air)"></i><i style="background:var(--grav)"></i></span>Forces and Motion</button>
    <nav class="lessons" id="lessonNav" aria-label="Weeks and lessons"></nav>
  </header>
  <main class="stageWrap"><div class="stage" id="stage" aria-live="polite"></div></main>
  <footer class="ctrl" id="ctrl">
    <button id="prev" aria-label="Previous slide">&larr; Back</button>
    <button id="next" aria-label="Next slide">Next &rarr;</button>
    <span class="count" id="count"></span>
    <div class="prog" aria-hidden="true"><i id="progBar"></i></div>
    <button id="notesBtn" aria-pressed="false">Teacher notes</button>
    <button id="fsBtn">Full screen</button>
    <span class="hint">Keys: &larr; &rarr; slides, N notes, T timer</span>
  </footer>
</div>
<aside class="notes" id="notes" hidden></aside>
<script>

/* ---------- helpers ---------- */
const CAN_EMBED = location.protocol === "file:" || /(^|\.)github\.io$/.test(location.hostname) || /^(localhost|127\.)/.test(location.hostname);
const MODES = {
  learn:["Learn","var(--air)"], watch:["Watch","var(--bad)"], talk:["Turn and talk","var(--grav)"],
  group:["Group work","var(--push)"], move:["Get moving","var(--fric)"], research:["Research","var(--air)"],
  write:["Quick write","var(--muted)"], check:["Check in","var(--accent)"], whole:["Whole class","var(--grav)"],
  prac:["Practical","var(--push)"], assess:["Assessment","var(--bad)"]
};
const FORCE = {push:"Applied force", fric:"Friction", air:"Air resistance", grav:"Gravity", mag:"Magnetic force", elec:"Electrostatic force"};
const LESSONS = [];
function $(s){return document.querySelector(s)}
function shuffle(a){return a.slice().sort(()=>Math.random()-.5)}

function player(id, title, source){
  return CAN_EMBED
    ? `<div class="vid"><iframe src="https://www.youtube-nocookie.com/embed/${id}?rel=0" title="${title}" allow="accelerometer; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>`
    : `<a class="vidlink" href="https://www.youtube.com/watch?v=${id}" target="_blank" rel="noopener"><span class="play" aria-hidden="true"></span><b>${title}</b><span>${source} &middot; opens on YouTube</span></a>`;
}
function vid(id, title, source, qs, tip){
  return `<div class="vgrid">${player(id,title,source)}<div class="box"><h3>Watch for</h3><ol>${qs.map(q=>`<li>${q}</li>`).join("")}</ol><p class="small">${title} &middot; ${source}${tip?`<br>${tip}`:""}</p></div></div>`;
}
const rv = (q,a,hint="Click to reveal") => `<button class="reveal" data-reveal><span class="q">${q}</span><span class="a">${a}</span><span class="hint">${hint}</span></button>`;
const steps = arr => `<ol class="steps">${arr.map(s=>`<li><span>${s}</span></li>`).join("")}</ol>`;
const tabs = items => `<div class="tabbar" role="tablist">${items.map((t,i)=>`<button role="tab" data-tab="${i}" aria-selected="${i===0}">${t[0]}</button>`).join("")}</div>${items.map((t,i)=>`<div class="panel box ${i===0?"on":""}" data-panel="${i}">${t[1]}</div>`).join("")}`;
const slot = (x,y,w,ans) => `<g class="slot" data-slot data-ans="${ans}" tabindex="0" role="button" aria-label="Label slot"><rect x="${x}" y="${y}" width="${w}" height="30" rx="7"/><text data-st x="${x+w/2}" y="${y+20}" text-anchor="middle">?</text></g>`;
const blank = ans => `<button class="blank" data-slot data-ans="${ans}"><span data-st>?</span></button>`;
const bankUI = `<div class="bank" id="bank"></div><div class="row"><button class="btn primary" id="slCheck">Check</button><button class="btn" id="slShow">Show answers</button><button class="btn" id="slReset">Reset</button><span class="small" id="slMsg">Click a word, then click where it goes.</span></div>`;
const sortUI = `<div class="sortItems" id="pool"></div><div class="zones" id="zones"></div><div class="row"><button class="btn primary" id="sortCheck">Check</button><button class="btn" id="sortReset">Reset</button><span class="small" id="sortMsg"></span></div>`;
const orderUI = (lo,hi) => `<div class="grid2 fill"><div style="display:flex;flex-direction:column;gap:1cqw"><div class="sortItems" id="oPool"></div><div class="row"><button class="btn primary" id="oCheck">Check</button><button class="btn" id="oShow">Show answer</button><button class="btn" id="oReset">Reset</button></div><p class="small" id="oMsg"></p></div><div style="display:flex;flex-direction:column;gap:.6cqw">${lo?`<div class="scale"><span>${lo}</span><span>${hi}</span></div>`:""}<ol class="ordered" id="oList"></ol></div></div>`;
const voteUI = (btn="Reveal answer") => `<div class="box fill" style="justify-content:center;align-items:center"><div class="spot" id="voteItem"></div><p id="voteAns" class="lead" style="text-align:center;max-width:60ch" hidden></p></div><div class="row"><button class="btn primary" id="voteReveal">${btn}</button><button class="btn" id="voteNext">Next</button><span class="small" id="voteCount"></span></div>`;


/* ---------- extra UI blocks ---------- */
const quizUI = `<div class="grid2 fill" style="grid-template-columns:1.5fr 1fr"><div style="display:flex;flex-direction:column;gap:1cqw"><p class="lead" id="qText"></p><div class="opts" id="qOpts"></div><p id="qWhy" class="small" style="color:var(--ink)" hidden></p><div class="row"><button class="btn primary" id="qReveal">Reveal answer</button><button class="btn" id="qNext">Next question</button></div></div><div style="display:flex;flex-direction:column;gap:.8cqw"><h3>Scores</h3><div class="teams" id="teams" style="grid-template-columns:1fr 1fr"></div></div></div>`;
const cornersUI = `<div class="grid2 fill" style="grid-template-columns:1fr 1.2fr"><div class="box"><h3>How it works</h3><div id="cornerHow"></div><div class="corners" id="cornerKey"></div></div><div class="box" style="justify-content:space-between"><div class="spot" id="cItem">Ready?</div><p id="cWhy" class="lead" style="text-align:center" hidden></p><div class="row" style="justify-content:center"><button class="btn primary" id="cNext">Next item</button><button class="btn" id="cShow">Show answer</button></div></div></div>`;
const cmapUI = `<div class="grid2 fill" style="grid-template-columns:1.6fr 1fr"><div style="display:grid;place-items:center" id="cmSvg"></div><div style="display:flex;flex-direction:column;gap:1cqw"><p>Before each click, ask the class: <b>how are these two linked?</b></p><div class="box" id="cmLabel" style="min-height:8cqw"></div><div class="row"><button class="btn primary" id="cmNext">Next link</button><button class="btn" id="cmAll">Show all</button><button class="btn" id="cmReset">Reset</button></div><p class="small" id="cmCount"></p></div></div>`;
const tugUI = `<div class="sim"><div class="simview" id="tugView"></div><div class="simctl"><label>Left force <span class="v" id="tugLv"></span><input type="range" id="tugL" min="0" max="100" step="10"></label><label>Right force <span class="v" id="tugRv"></span><input type="range" id="tugR" min="0" max="100" step="10"></label><div class="row"><button class="btn primary" id="tugGo">Let go</button><button class="btn" id="tugReset">Reset</button></div><div class="verdict" id="tugOut"></div></div></div>`;
const scaleUI = `<div class="sim"><div class="simview" id="scView"></div><div class="simctl"><div id="scPlanets"></div><div class="row"><button class="btn primary" data-add="100">Hang 100 g</button><button class="btn" data-add="50">Hang 50 g</button><button class="btn" id="scClear">Remove all</button></div><div class="row"><button class="btn" id="scHide" aria-pressed="false">Cover the reading</button></div><div class="box"><div class="readout" id="scMass"></div><div class="readout" id="scRead"></div></div></div></div>`;
const rampUI = `<div class="sim"><div style="display:flex;flex-direction:column;gap:1cqw;min-width:0"><div class="simview" id="rpView" style="flex:1;height:auto"></div><div class="tablewrap"><table class="mini" id="rpTable"></table></div></div><div class="simctl"><label>Surface<select id="rpSurf"></select></label><label>Ramp height <span class="v" id="rpHv"></span><input type="range" id="rpH" min="10" max="30" step="5" value="20"></label><div class="row"><button class="btn primary" id="rpGo">Release car</button><button class="btn" id="rpClear">Clear results</button></div><div class="box"><div class="readout" id="rpOut">0 cm<small>distance travelled past the end of the ramp</small></div></div></div></div>`;
const chuteUI = `<div class="sim" style="grid-template-columns:1fr 1.4fr"><div class="simview" id="chView"></div><div class="simctl"><label>Canopy size (square) <span class="v" id="chSv"></span><input type="range" id="chS" min="0" max="60" step="10" value="30"></label><label>Canopy material<select id="chM"></select></label><label>String length<select id="chL"><option value="15">15 cm</option><option value="30" selected>30 cm</option><option value="45">45 cm</option></select></label><label>Load <span class="v" id="chPv"></span><input type="range" id="chP" min="1" max="8" step="1" value="3"></label><div class="row"><button class="btn primary" id="chGo">Drop from 2 m</button><button class="btn" id="chClear">Clear</button></div><div class="readout" id="chOut">0.00 s<small>fall time</small></div><div class="tablewrap"><table class="mini" id="chTable"></table></div></div></div>`;
const fdUI = `<div class="sim"><div class="simview" id="fdView"></div><div class="simctl"><div class="fpick" id="fdPick"></div><div class="row"><button class="btn primary" id="fdNext">Next arrow</button><button class="btn" id="fdAll">All arrows</button><button class="btn" id="fdAsk">Balanced or unbalanced?</button></div><div class="verdict" id="fdOut" hidden></div><p class="small" id="fdHint"></p></div></div>`;
const magUI = `<div class="sim"><div class="simview" id="mgView"></div><div class="simctl"><div class="row"><button class="btn" id="mgFlipA">Flip left magnet</button><button class="btn" id="mgFlipB">Flip right magnet</button></div><div class="row"><button class="btn primary" id="mgGo">Let go</button><button class="btn" id="mgReset">Reset</button></div><div class="verdict" id="mgOut"><p class="small">Predict first: will they attract or repel?</p></div></div></div>`;
const chargeUI = `<div class="sim"><div class="simview" id="cgView"></div><div class="simctl"><div class="row"><button class="btn primary" id="cgRub">Rub balloon on hair</button><button class="btn" id="cgNear">Bring balloon close</button><button class="btn" id="cgReset">Reset</button></div><div class="verdict" id="cgOut"></div></div></div>`;

/* ---------- charts ---------- */
function lineChart(series, o){
  const W=600,H=o.h||230,P={l:48,r:16,t:16,b:30};
  const xs=series.flatMap(s=>s.pts.map(p=>p[0])), ys=series.flatMap(s=>s.pts.map(p=>p[1]));
  const x0=o.xmin??Math.min(...xs), x1=o.xmax??Math.max(...xs), y0=o.ymin??Math.min(...ys), y1=o.ymax??Math.max(...ys);
  const X=v=>P.l+(v-x0)/(x1-x0)*(W-P.l-P.r), Y=v=>H-P.b-(v-y0)/(y1-y0)*(H-P.t-P.b);
  let g=o.yticks.map(v=>`<line x1="${P.l}" x2="${W-P.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${P.l-6}" y="${Y(v)+4}" text-anchor="end">${v}</text>`).join("");
  g+=o.xticks.map(v=>`<text x="${X(v)}" y="${H-10}" text-anchor="middle">${v}</text>`).join("");
  const lines=series.map(s=>{
    const d=s.pts.map((p,i)=>`${i?"L":"M"}${X(p[0]).toFixed(1)} ${Y(p[1]).toFixed(1)}`).join(" ");
    return `<g ${s.hidden?'opacity="0"':""}>${s.line===false?"":`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.w||2.5}" ${s.dash?`stroke-dasharray="${s.dash}"`:""}/>`}
      ${s.pts.map(p=>`<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="${s.r||4}" fill="${p[2]||s.color}"/>`).join("")}</g>`}).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${o.label}">${g}${lines}<text x="${P.l}" y="11" font-weight="700" style="fill:var(--ink)">${o.ylabel}</text>${o.xlabel?`<text x="${W-P.r}" y="${H-10+0}" text-anchor="end" font-weight="700" style="fill:var(--ink)" dy="-14">${o.xlabel}</text>`:""}</svg>`;
}
function barChart(cats, vals, o){
  const W=600,H=o.h||240,P={l:48,r:16,t:22,b:34},n=cats.length,bw=(W-P.l-P.r)/n;
  const y1=o.ymax, Y=v=>H-P.b-v/y1*(H-P.t-P.b);
  let g=o.yticks.map(v=>`<line x1="${P.l}" x2="${W-P.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${P.l-6}" y="${Y(v)+4}" text-anchor="end">${v}</text>`).join("");
  g+=cats.map((c,i)=>{const x=P.l+i*bw+bw*.18,w=bw*.64,v=vals[i];return `<rect x="${x}" y="${Y(v)}" width="${w}" height="${Y(0)-Y(v)}" rx="4" fill="${(o.colors&&o.colors[i])||"var(--accent)"}"/><text x="${x+w/2}" y="${Y(v)-6}" text-anchor="middle" style="fill:var(--ink);font-weight:700">${v}</text><text x="${x+w/2}" y="${H-12}" text-anchor="middle">${c}</text>`}).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${o.label}">${g}<line x1="${P.l}" x2="${W-P.r}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--ink)"/><text x="${P.l}" y="12" font-weight="700" style="fill:var(--ink)">${o.ylabel}</text></svg>`;
}

/* ---------- shared drawings ---------- */
const AR = (id,col) => `<marker id="${id}" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0L10 5L0 10z" fill="${col}"/></marker>`;
function arrowSVG(x1,y1,x2,y2,col,lab,id,w=7){
  const horiz=y1===y2;
  const lx=horiz?x2:x2+12, ly=horiz?y1-14:(y2<y1?y2+12:y2-2), anchor=horiz?(x2>x1?"end":"start"):"start";
  return `<g><defs>${AR(id,col)}</defs><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col}" stroke-width="${w}" stroke-linecap="round" marker-end="url(#${id})"/>${lab?`<text class="arrowlab" x="${lx}" y="${ly}" text-anchor="${anchor}" fill="${col}">${lab}</text>`:""}</g>`;
}

function earthPullSVG(){
  const ang=[0,60,120,180,240,300];
  return `<svg viewBox="0 0 320 320" width="88%" role="img" aria-label="People standing all around Earth, each pulled towards the centre">
  <circle cx="160" cy="160" r="100" fill="var(--push)" opacity=".85"/><path d="M100 120 q30 -40 70 -15 q15 25 -10 45 q-30 5 -40 30 q-25 -10 -20 -60z M175 180 q35 -10 50 20 q-10 30 -40 30 q-20 -20 -10 -50z" fill="var(--grav)" opacity=".5"/>
  ${ang.map(a=>{const r=a*Math.PI/180,sx=Math.sin(r),cy=-Math.cos(r);
    return `<g transform="translate(${160+sx*100} ${160+cy*100}) rotate(${a})"><rect x="-4" y="-22" width="8" height="22" rx="3" fill="var(--ink)"/><circle cx="0" cy="-29" r="7" fill="var(--ink)"/></g>${arrowSVG(160+sx*86,160+cy*86,160+sx*40,160+cy*40,"var(--surface)","","ep"+a,5)}`}).join("")}
  <circle cx="160" cy="160" r="5" fill="var(--surface)"/></svg>`;
}

/* ---------- interactives (data-driven; each receives the slide) ---------- */
let _sh=new Map(); function shuffleOnce(a){if(!_sh.has(a))_sh.set(a,shuffle(a));return _sh.get(a)}
let RAF=null; function stopAnim(){if(RAF)cancelAnimationFrame(RAF);RAF=null}
const rnd=(pct)=>1+(Math.random()*2-1)*pct;

const INIT = {
  vote(s){
    const items=s.data; let i=0; const it=$("#voteItem"),an=$("#voteAns"),ct=$("#voteCount"),rb=$("#voteReveal");
    const show=()=>{it.innerHTML=items[i][0];an.innerHTML=items[i][1]||"";an.hidden=true;rb.hidden=!items[i][1];ct.textContent=`${i+1} of ${items.length}`};
    rb.onclick=()=>an.hidden=false; $("#voteNext").onclick=()=>{i=(i+1)%items.length;show()}; show();
  },
  cmap(s){
    const n=s.data.nodes,E=s.data.edges;
    const edges=E.map((e,i)=>{const a=n[e[0]],b=n[e[1]];const bend=(i%2?1:-1)*(e[3]??20);const mx=(a[0]+b[0])/2+bend,my=(a[1]+b[1])/2-bend;
      return `<g class="cm-edge" data-e="${i}" opacity="0"><path d="M${a[0]} ${a[1]} Q${mx} ${my} ${b[0]} ${b[1]}" fill="none" stroke="var(--muted)" stroke-width="2.5" marker-end="url(#cmah)"/><circle cx="${mx}" cy="${my}" r="12" fill="var(--accent)"/><text x="${mx}" y="${my+4}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--accent-ink)">${i+1}</text></g>`}).join("");
    const nodes=Object.values(n).map(v=>`<g><rect x="${v[0]-66}" y="${v[1]-19}" width="132" height="38" rx="19" fill="var(--surface)" stroke="${v[3]}" stroke-width="3"/><text x="${v[0]}" y="${v[1]+5}" text-anchor="middle" font-size="14" font-weight="700" fill="${v[3]}">${v[2]}</text></g>`).join("");
    $("#cmSvg").innerHTML=`<svg viewBox="0 0 600 380" width="100%" role="img" aria-label="Concept map"><defs><marker id="cmah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--muted)"/></marker></defs>${edges}${nodes}</svg>`;
    let k=0; const g=[...document.querySelectorAll(".cm-edge")],lab=$("#cmLabel"),cnt=$("#cmCount");

  /* tug of war: balanced and unbalanced forces */
  tug(s){
    const d=s.data||{}, L=$("#tugL"), R=$("#tugR"); L.value=d.l??40; R.value=d.r??40;
    const view=$("#tugView"); let off=0;
    const draw=()=>{const l=+L.value,r=+R.value,net=r-l,cx=300+off;
      $("#tugLv").textContent=`${l} N`;$("#tugRv").textContent=`${r} N`;
      view.innerHTML=`<svg viewBox="0 0 600 230" role="img" aria-label="Cart with a force arrow pulling each way">
        <rect x="0" y="176" width="600" height="54" fill="color-mix(in srgb,var(--fric) 22%,var(--surface))"/><line x1="0" y1="176" x2="600" y2="176" stroke="var(--ink)" stroke-width="2"/>
        <g id="tugCart" style="transition:transform 1.4s cubic-bezier(.55,0,1,.45);transform:translateX(${off}px)">
          <rect x="250" y="112" width="100" height="52" rx="8" fill="var(--surface)" stroke="var(--ink)" stroke-width="3"/>
          <circle cx="272" cy="168" r="10" fill="var(--ink)"/><circle cx="328" cy="168" r="10" fill="var(--ink)"/>
          ${l?arrowSVG(250,138,250-l*1.9,138,"var(--push)",`${l} N`,"tl"):""}${r?arrowSVG(350,138,350+r*1.9,138,"var(--fric)",`${r} N`,"tr"):""}
        </g>
        <text x="300" y="40" text-anchor="middle" font-size="18" font-weight="700" fill="${net?"var(--bad)":"var(--good)"}">${net?`Net force ${Math.abs(net)} N to the ${net>0?"right":"left"}`:"Net force 0 N"}</text>
        ${net?arrowSVG(300,70,300+Math.sign(net)*Math.max(30,Math.abs(net)*1.9),70,"var(--bad)","","tn",5):""}</svg>`;
      $("#tugOut").innerHTML=net?`<p class="lead"><b>Unbalanced.</b></p><p>The forces are different sizes, so the cart's motion <b>changes</b>: it speeds up towards the ${net>0?"right":"left"}.</p>`:`<p class="lead"><b>Balanced.</b></p><p>Equal forces in opposite directions cancel out. A still cart <b>stays still</b>. A moving cart would keep moving at the <b>same speed</b>.</p>`;
    };
    L.oninput=R.oninput=()=>{off=0;draw()};
    $("#tugGo").onclick=()=>{const net=+R.value-+L.value;off=Math.max(-230,Math.min(230,Math.sign(net)*Math.min(230,Math.abs(net)*4)));const c=$("#tugCart");if(c)c.style.transform=`translateX(${off}px)`;if(!net){$("#tugOut").insertAdjacentHTML("beforeend",`<p class="small">Nothing happens. That is what balanced looks like.</p>`)}};
    $("#tugReset").onclick=()=>{off=0;L.value=d.l??40;R.value=d.r??40;draw()}; draw();
  },

  /* toy car ramp simulator */
  ramp(s){

        <text x="${x0-12}" y="${yF+44}" text-anchor="end" font-size="12" fill="var(--muted)">cm</text>
        ${dist!=null?`<line x1="${x0}" x2="${x0+dist*px}" y1="${yF-30}" y2="${yF-30}" stroke="var(--accent)" stroke-width="2" stroke-dasharray="5 4"/><text x="${x0+dist*px/2}" y="${yF-36}" text-anchor="middle" font-size="14" font-weight="700" fill="var(--accent)">${dist} cm</text>`:""}

      rocket:`<path d="M300 80 q30 30 30 80 v60 h-60 v-60 q0 -50 30 -80z" fill="var(--surface)" stroke="var(--ink)" stroke-width="3"/><circle cx="300" cy="140" r="10" fill="var(--air)"/><path d="M270 200 l-18 26 h18z M330 200 l18 26 h-18z" fill="var(--bad)"/><path d="M282 220 q18 50 36 0z" fill="var(--elec)"/>`,
      lamp:`<line x1="300" y1="0" x2="300" y2="120" stroke="var(--ink)" stroke-width="3"/><path d="M260 170 q40 -60 80 0z" fill="var(--elec)" stroke="var(--ink)" stroke-width="3"/><circle cx="300" cy="176" r="10" fill="#fff6c8" stroke="var(--ink)"/>`,

  /* two bar magnets */
  magnet(){
    let a=1,b=1,gap=0;const draw=()=>{const half=(x,p)=>`<rect x="${x}" y="0" width="80" height="50" fill="${p==="N"?"var(--bad)":"var(--air)"}"/><text x="${x+40}" y="34" text-anchor="middle" font-size="24" font-weight="800" fill="#fff">${p}</text>`;
      const mag=(x,flip)=>`<g style="transition:transform .8s" transform="translate(${x} 110)">${half(0,flip?"S":"N")}${half(80,flip?"N":"S")}<rect width="160" height="50" fill="none" stroke="var(--ink)" stroke-width="3"/></g>`;
      const xa=110-gap,xb=330+gap;
      $("#mgView").innerHTML=`<svg viewBox="0 0 600 270" role="img" aria-label="Two bar magnets">${mag(xa,a<0)}${mag(xb,b<0)}<text x="300" y="220" text-anchor="middle" font-size="15" fill="var(--muted)">Facing poles: ${a>0?"S":"N"} and ${b>0?"N":"S"}</text></svg>`};
    const facing=()=>[a>0?"S":"N",b>0?"N":"S"];
    $("#mgFlipA").onclick=()=>{a=-a;gap=0;draw();$("#mgOut").innerHTML=`<p class="small">Predict: attract or repel?</p>`};
    $("#mgFlipB").onclick=()=>{b=-b;gap=0;draw();$("#mgOut").innerHTML=`<p class="small">Predict: attract or repel?</p>`};
    $("#mgGo").onclick=()=>{const [p,q]=facing(),att=p!==q;gap=att?-55:80;draw();
      $("#mgOut").innerHTML=att?`<p class="lead"><b>Attract.</b></p><p>${p} faces ${q}. <b>Unlike poles attract</b>, so the magnets pull together without touching first. That is a non-contact force.</p>`:`<p class="lead"><b>Repel.</b></p><p>${p} faces ${q}. <b>Like poles repel</b>, so the magnets push apart.</p>`};
    $("#mgReset").onclick=()=>{a=1;b=1;gap=0;draw();$("#mgOut").innerHTML=`<p class="small">Predict first: will they attract or repel?</p>`};
    draw();
  },

  /* balloon and hair: electrostatic force */
  charges(){
    let rubs=0,near=false;
    const draw=()=>{const moved=Math.min(rubs*3,12),bx=near?250:420;
      const hairNeg=12-moved,balNeg=moved;
      const plus=(x,y)=>`<text x="${x}" y="${y}" font-size="16" font-weight="800" fill="var(--bad)" text-anchor="middle">+</text>`,minus=(x,y)=>`<text x="${x}" y="${y}" font-size="18" font-weight="800" fill="var(--air)" text-anchor="middle">&minus;</text>`;
      const head=[];for(let i=0;i<12;i++){const x=95+(i%4)*26,y=95+Math.floor(i/4)*24;head.push(plus(x,y));if(i<hairNeg)head.push(minus(x+12,y+8))}
      const bal=[];for(let i=0;i<balNeg;i++){const ang=i/12*Math.PI*2;bal.push(minus(bx+Math.cos(ang)*38,175+Math.sin(ang)*48+5))}
      const lean=near&&moved>0?Math.min(14,moved):0;
      $("#cgView").innerHTML=`<svg viewBox="0 0 600 320" role="img" aria-label="Balloon and hair with charges">
        <circle cx="134" cy="150" r="70" fill="color-mix(in srgb,var(--elec) 25%,var(--surface))" stroke="var(--ink)" stroke-width="2"/>
        ${Array.from({length:9},(_,i)=>`<path d="M${84+i*12} 92 q${lean} ${-30} ${lean*2} ${-50}" stroke="var(--fric)" stroke-width="3" fill="none"/>`).join("")}
        ${head.join("")}<text x="134" y="250" text-anchor="middle" font-size="14" fill="var(--muted)">hair: ${moved?`lost ${moved} electrons, now positive`:"neutral (equal + and &minus;)"}</text>
        <ellipse cx="${bx}" cy="175" rx="48" ry="60" fill="color-mix(in srgb,var(--mag) 30%,var(--surface))" stroke="var(--ink)" stroke-width="2"/><path d="M${bx} 235 l-6 10 h12z" fill="var(--ink)"/><path d="M${bx} 245 q10 30 -4 60" stroke="var(--ink)" fill="none"/>
        ${bal.join("")}<text x="${bx}" y="315" text-anchor="middle" font-size="14" fill="var(--muted)">balloon: ${moved?`gained ${moved} electrons, now negative`:"neutral"}</text></svg>`;
      $("#cgOut").innerHTML=!moved?`<p class="small">Both objects start neutral. Rub to move electrons.</p>`:near?`<p class="lead"><b>Attract!</b></p><p>The negative balloon and the positive hair attract. <b>Unlike charges attract</b>, even across a gap. That is the electrostatic force.</p>`:`<p>Rubbing moved <b>${moved}</b> electrons (&minus;) from the hair to the balloon. Now bring the balloon close.</p>`};
    $("#cgRub").onclick=()=>{rubs++;near=false;draw()};$("#cgNear").onclick=()=>{near=true;draw()};$("#cgReset").onclick=()=>{rubs=0;near=false;draw()};draw();
  }
};
